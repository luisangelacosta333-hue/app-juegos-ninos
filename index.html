<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚀 Woody Planet · Ultimate Premium Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* CSS SUPER PREMIUM - DEEP SPACE GLASSMORPHISM & NEON */
:root {
  --bg-dark: #03000a;
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.6);
  --neon-cyan: #00f0ff;
  --neon-pink: #ff007f;
  --neon-purple: #8a2be2;
  --neon-gold: #fbbf24;
}

* { font-family: 'Nunito', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; padding: 0; min-height: 100vh; color: #fff; overflow-x: hidden; scroll-behavior: smooth; cursor: default; }
body { background: var(--bg-dark); }

/* Fondo Dinámico Espacial Premium */
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; }
body::before {
  background: radial-gradient(circle at 15% 30%, rgba(138, 43, 226, 0.2), transparent 50%),
              radial-gradient(circle at 85% 70%, rgba(0, 240, 255, 0.2), transparent 50%),
              radial-gradient(circle at 50% 100%, rgba(255, 0, 127, 0.15), transparent 50%);
  animation: cosmicPulse 15s ease-in-out infinite alternate;
}
body::after {
  background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
  background-size: 40px 40px; opacity: 0.15; transform: perspective(600px) rotateX(15deg) translateY(-20px);
}
@keyframes cosmicPulse { 0% { transform: scale(1); } 100% { transform: scale(1.08) rotate(1deg); } }

/* Efecto Mágico al hacer clic (Polvo de estrellas) */
.click-spark { position: fixed; width: 8px; height: 8px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 99999; box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-cyan); animation: sparkAnim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
@keyframes sparkAnim { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

/* Cajas Glassmorphism Ultimate */
.vidrio {
  position: relative; background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border-radius: 40px; padding: 40px 24px; border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.15);
}
.vidrio-fino {
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.vidrio-fino:hover { transform: translateY(-6px) scale(1.03); background: rgba(255,255,255,0.15); box-shadow: 0 15px 40px rgba(0,240,255,0.2); border-color: rgba(0,240,255,0.4); }

/* Títulos Neón Animados */
.tit-neon {
  font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(90deg, #00f0ff, #8a2be2, #ff007f, #fde047, #00f0ff);
  background-size: 300% 100%; -webkit-background-clip: text; color: transparent;
  animation: bgGlow 6s linear infinite; filter: drop-shadow(0 0 25px rgba(138,43,226,0.7));
}
@keyframes bgGlow { to { background-position: 300% } }

/* Botones Premium 3D */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 58px; padding: 14px 30px; border-radius: 100px;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.2); color: #fff; font-weight: 900; font-size: 1.1rem;
  cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); position: relative; overflow: hidden;
}
.btn::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); transition: 0.5s; opacity: 0; }
.btn:hover::after { opacity: 1; transform: rotate(45deg) translateX(50%); }
.btn:hover { background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08)); transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.4); }
.btn:active { transform: scale(0.92) !important; }

.btn.on { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border-color: #fff; box-shadow: 0 10px 30px rgba(138, 43, 226, 0.8), inset 0 2px 5px rgba(255,255,255,0.5); text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
.tab-btn { padding: 12px 26px; border-radius: 18px; font-size: 1rem; font-weight: 800; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab-btn:hover { background: rgba(255,255,255,0.15); color: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }
.tab-btn.active { background: linear-gradient(135deg, #facc15, #f59e0b); color: #451a03; border-color: #fff; box-shadow: 0 8px 25px rgba(250, 204, 21, 0.6); }

/* Opciones de Juego - Botones Quiz */
.pal {
  padding: 30px 24px; border-radius: 32px; font-size: 1.6rem; font-weight: 900;
  cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 2px solid rgba(255,255,255,0.15); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; min-height: 150px; text-align: center; line-height: 1.3;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.1);
}
.pal .ico { font-size: 4.5rem; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.pal:hover { transform: translateY(-10px) scale(1.04); background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05)); border-color: rgba(0,240,255,0.5); box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 25px rgba(0,240,255,0.2); }
.pal:hover .ico { transform: scale(1.15) translateY(-5px); }
.pal:active { transform: scale(0.95); }

/* Feedback de Acierto / Error */
.ok { background: linear-gradient(135deg, #10b981, #059669) !important; border-color: #a7f3d0 !important; color: #fff !important; box-shadow: 0 0 50px rgba(16, 185, 129, 0.9) !important; animation: correctBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important; }
.no { background: linear-gradient(135deg, #ef4444, #b91c1c) !important; border-color: #fecaca !important; color: #fff !important; box-shadow: 0 0 40px rgba(239, 68, 68, 0.8) !important; animation: errorShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important; }
@keyframes correctBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-10px); } }
@keyframes errorShake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }

/* Botones Especiales Tienda/Premium */
.btn-oro { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; border: 2px solid #fef08a; box-shadow: 0 10px 30px rgba(217,119,6,0.7); text-shadow: 0 2px 5px rgba(0,0,0,0.4); }
.bocina { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: 3px solid #fff; border-radius: 50%; width: 85px; height: 85px; font-size: 3rem; cursor: pointer; box-shadow: 0 12px 35px rgba(0,240,255,0.6); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; justify-content: center; margin: 0 auto; z-index: 10; }
.bocina:hover { transform: scale(1.15) rotate(-15deg); box-shadow: 0 20px 50px rgba(0,240,255,0.9); }
.bocina:active { transform: scale(0.9); }

/* Astronauta Animado Flotante Premium */
.prof-container { position: fixed; bottom: 25px; right: 25px; z-index: 55; cursor: pointer; transition: transform 0.3s; }
.prof { font-size: 5.5rem; filter: drop-shadow(0 15px 25px rgba(0,240,255,0.7)); animation: floatAstronaut 5s ease-in-out infinite; transform-origin: center; }
.prof-container:hover .prof { animation: hyperSpace 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
@keyframes floatAstronaut { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-20px) rotate(-8deg); } 75% { transform: translateY(-15px) rotate(8deg); } }
@keyframes hyperSpace { 0% { transform: scale(1); } 50% { transform: scale(1.4) translateY(-40px) rotate(-20deg); filter: drop-shadow(0 30px 50px rgba(255,0,127,1)); } 100% { transform: scale(1.2) translateY(-25px) rotate(-10deg); filter: drop-shadow(0 20px 30px rgba(255,0,127,0.8)); } }

.globo { position: fixed; bottom: 150px; right: 110px; z-index: 54; max-width: 300px; background: rgba(255,255,255,0.98); backdrop-filter: blur(15px); color: #0f172a; padding: 22px 28px; border-radius: 35px 35px 6px 35px; font-weight: 900; font-size: 1.2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 3px solid var(--neon-cyan); animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
.globo::after { content: ""; position: absolute; bottom: -15px; right: 28px; border: 15px solid transparent; border-top-color: var(--neon-cyan); }
.globo::before { content: ""; position: absolute; bottom: -10px; right: 30px; border: 10px solid transparent; border-top-color: #fff; z-index: 1; }
@keyframes popIn { from { opacity: 0; transform: translateY(30px) scale(0.7) rotate(5deg); } }

/* Modales */
.modal-overlay { position: fixed; inset: 0; background: rgba(3,0,10,0.9); backdrop-filter: blur(15px); z-index: 99000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px; }
.modal-overlay.activo { opacity: 1; pointer-events: auto; }
.particula { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 99998; animation: confeti 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; box-shadow: 0 0 15px currentColor; }
@keyframes confeti { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(1080deg); opacity: 0; } }

/* =========================================
   ESTILOS PREMIUM PARA JUEGOS INTERACTIVOS 
   ========================================= */

/* MEMORIA 3D */
.carta { aspect-ratio: 1/1; cursor: pointer; perspective: 1200px; user-select: none; }
.carta-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
.carta.girada .carta-inner { transform: rotateY(180deg) scale(1.05); }
.cara { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 4rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.cf { background: linear-gradient(135deg, #1e293b, #0f172a); color: #38bdf8; border: 2px solid rgba(56,189,248,0.3); font-family: 'Orbitron'; font-weight: 900; }
.cf::after { content: "WP"; font-size: 1.5rem; opacity: 0.5; position: absolute; }
.ca { transform: rotateY(180deg); background: linear-gradient(135deg, #fef08a, #f59e0b); border: 2px solid #fff; }

/* ROMPECABEZAS */
.rompe-ficha { aspect-ratio: 1/1; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 900; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
.rompe-llena { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: 2px solid rgba(255,255,255,0.5); text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
.rompe-llena:hover { transform: scale(1.05); z-index: 10; box-shadow: 0 12px 30px rgba(0,240,255,0.6); }
.rompe-vacia { background: rgba(0,0,0,0.4); border: 2px dashed rgba(255,255,255,0.2); }

/* SIMON DICE NEON */
.simon-btn { border-radius: 32px; cursor: pointer; opacity: 0.3; transition: all 0.15s; border: 6px solid rgba(255,255,255,0.1); box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
.simon-btn.activo { opacity: 1; transform: scale(1.08); box-shadow: 0 0 50px currentColor, inset 0 0 30px #fff; border-color: #fff; z-index: 10; }

/* TECLADO PIANO */
.tecla { flex: 1; margin: 0 3px; border-radius: 0 0 20px 20px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; font-weight: 900; transition: all 0.1s; user-select: none; font-size: 1.2rem; }
.tecla-blanca { background: linear-gradient(180deg, #ffffff, #e2e8f0); height: 240px; z-index: 1; border: 1px solid #cbd5e1; color: #0f172a; box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 -5px 10px rgba(0,0,0,0.1); }
.tecla-blanca.activa { background: #cbd5e1; transform: translateY(6px); box-shadow: 0 2px 5px rgba(0,0,0,0.4); color: var(--neon-pink); }
.tecla-negra { background: linear-gradient(180deg, #1e293b, #020617); height: 140px; width: 48px; margin-left: -24px; margin-right: -24px; z-index: 2; color: #38bdf8; box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 -3px 8px rgba(255,255,255,0.2); border-radius: 0 0 12px 12px; }
.tecla-negra.activa { background: #334155; transform: translateY(6px); color: var(--neon-cyan); }

@media (max-width: 640px) {
  .prof-container { right: 10px; bottom: 10px; } .prof { font-size: 4.5rem; }
  .globo { right: 90px; bottom: 120px; font-size: 1.05rem; max-width: 240px; padding: 18px; }
  .pal { min-height: 120px; padding: 20px; font-size: 1.3rem; } .pal .ico { font-size: 3.5rem; }
  .btn { min-height: 50px; padding: 12px 20px; font-size: 1rem; }
}
</style>
</head>
<body>

<div id="intro" class="fixed inset-0 bg-[#03000a] z-[100000] flex items-center justify-center flex-col transition-opacity duration-700">
  <div class="text-9xl mb-8 drop-shadow-[0_0_40px_rgba(0,240,255,0.9)] animate-bounce">🚀</div>
  <div class="tit-neon text-4xl md:text-7xl text-center">WOODY PLANET</div>
  <div class="text-cyan-300 mt-6 font-black text-2xl tracking-[0.3em] uppercase drop-shadow-md">Ultimate Premium</div>
  <div class="w-80 h-5 bg-white/10 rounded-full mt-12 overflow-hidden border-2 border-white/20 p-1"><div class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 w-0 transition-all duration-1000 shadow-[0_0_15px_rgba(255,0,127,0.8)]" id="barraCarga"></div></div>
</div>

<div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center gap-4 flex-wrap relative z-10">
  <div class="vidrio-fino p-3 px-6 flex items-center gap-5 cursor-pointer" onclick="mostrarPerfil()">
    <div id="avatarPerfil" class="text-5xl bg-white/10 rounded-full w-16 h-16 flex items-center justify-center border-2 border-white/20 shadow-[0_0_20px_rgba(255,255,255,0.3)]">👦</div>
    <div>
      <div id="nomP" class="font-black text-white text-xl tracking-wider">Jugador</div>
      <div class="text-md font-bold text-yellow-400 drop-shadow-md">🪙 <span id="monedasTot">0</span></div>
    </div>
  </div>
  <div class="flex gap-4 flex-wrap">
    <button class="btn border-pink-500 hover:border-pink-400 shadow-[0_0_20px_rgba(255,0,127,0.4)]" onclick="verAnuncio()">🎬 +50 Monedas</button>
    <button class="btn" onclick="abrirTienda()">🏪 Tienda</button>
    <button class="btn" onclick="sonido.toggleMusica()" id="btnMus">🔇 Música</button>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 pt-6 pb-40 relative z-10">
  <div class="flex flex-wrap gap-4 justify-center mb-8 bg-black/40 p-4 rounded-[40px] border border-white/10 backdrop-blur-xl shadow-2xl" id="cats"></div>
  <div class="flex flex-wrap gap-3 justify-center mb-12" id="tabs"></div>
  <div id="juegos" class="vidrio min-h-[550px]"></div>
</div>

<div class="prof-container" onclick="hablarWoody()">
  <div class="prof" id="prof">👨‍🚀</div>
</div>

<div id="mascotaFija" class="fixed bottom-8 left-8 z-50 text-7xl hidden drop-shadow-[0_0_30px_rgba(255,255,255,0.8)] animate-bounce"></div>

<!-- MODALES PREMIUM -->
<div id="perfilModal" class="modal-overlay"><div class="vidrio max-w-md w-full p-10 text-center"><h2 class="tit-neon text-4xl mb-10">Tu Perfil</h2><input id="nomPerfil" placeholder="Tu nombre" class="w-full p-5 rounded-3xl bg-black/50 border-2 border-white/20 text-white text-center text-3xl mb-10 outline-none focus:border-cyan-400 focus:shadow-[0_0_25px_rgba(0,240,255,0.5)] transition-all font-black"><div id="avatares" class="grid grid-cols-3 gap-5 mb-10"></div><button class="btn btn-oro w-full text-3xl py-5" onclick="guardarPerfil()">✅ Guardar</button></div></div>
<div id="tiendaModal" class="modal-overlay"><div class="vidrio max-w-4xl w-full p-10 max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center mb-10"><h2 class="tit-neon text-5xl">🏪 Tienda Premium</h2><button class="w-14 h-14 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition-all text-3xl font-black border-2 border-red-500/50 flex items-center justify-center" onclick="cerrarModal('tiendaModal')">✕</button></div><div class="text-center mb-12 text-4xl font-black text-yellow-400 bg-yellow-400/10 py-6 rounded-[40px] border-2 border-yellow-400/40 shadow-inner">Monedas: 🪙 <span id="tiendaMonedas">0</span></div><h3 class="text-3xl font-black text-pink-400 mb-8 tracking-[0.2em] uppercase text-center drop-shadow-md">🐾 Mascotas Espaciales</h3><div id="tiendaMascotas" class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-12"></div><h3 class="text-3xl font-black text-cyan-400 mb-8 tracking-[0.2em] uppercase text-center drop-shadow-md">👑 Equipamiento</h3><div id="tiendaAccesorios" class="grid grid-cols-2 md:grid-cols-4 gap-8"></div></div></div>
<div id="premioModal" class="modal-overlay z-[99999]"><div class="vidrio max-w-md w-full p-12 text-center"><div id="premioIcono" class="text-[150px] mb-8 drop-shadow-[0_0_40px_rgba(255,255,255,0.9)] animate-bounce">🎁</div><h2 id="premioTexto" class="text-5xl font-black text-yellow-400 mb-12 tracking-wider drop-shadow-lg">¡GANASTE!</h2><button class="btn btn-oro px-12 py-5 text-3xl w-full" onclick="cerrarModal('premioModal')">¡Increíble!</button></div></div>

<script>
// ==========================================
// SISTEMA CORE, AUDIO Y EFECTOS
// ==========================================
let runId = 0; 
const sonido = (() => { let ctx; const ini = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }; const tono = (f = 440, d = 0.2, t = 'sine', v = 0.1) => { ini(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d); }; const mel = arr => arr.forEach(([f, d], n) => setTimeout(() => tono(f, d), n * 140)); return { ini, tono, click: () => tono(600, 0.05, 'square', 0.05), ok: () => mel([[523, 0.1], [659, 0.1], [784, 0.15]]), no: () => mel([[300, 0.15], [200, 0.2]]), ganar: () => mel([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.3]]), moneda: () => tono(1200, 0.1, 'sine', 0.05), toggleMusica() { ini(); this._m = !this._m; document.getElementById('btnMus').textContent = this._m ? '🔊 Música' : '🔇 Música'; if (this._m) { const n = [261, 329, 392, 523]; let i = 0; const lp = () => { if (!this._m) return; tono(n[i % 4], 0.2, 'triangle', 0.02); i++; this._t = setTimeout(lp, 600); }; lp(); } else clearTimeout(this._t); } }; })(); 

// Efecto de chispas en toda la pantalla
document.addEventListener('click', (e) => {
  sonido.ini();
  const spark = document.createElement('div'); spark.className = 'click-spark';
  spark.style.left = e.clientX + 'px'; spark.style.top = e.clientY + 'px';
  spark.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
  spark.style.setProperty('--ty', (Math.random() - 0.5) * 100 + 'px');
  document.body.appendChild(spark); setTimeout(() => spark.remove(), 800);
});

function hablarIngles(texto) { try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1; const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }

  const gc = document.getElementById('gameContainer');
  const dics = [{es:"Perro",en:"DOG",ico:"🐶"},{es:"Gato",en:"CAT",ico:"🐱"},{es:"Sol",en:"SUN",ico:"🌞"},{es:"Luna",en:"MOON",ico:"🌙"},{es:"Rojo",en:"RED",ico:"🔴"},{es:"Azul",en:"BLUE",ico:"🔵"}];
  const c = rp(dics); const letrasStr = c.en; const letras = mezclar(letrasStr.split(''));
  let el = []; const myRun = runId;
  const dib = () => {
    if(myRun !== runId) return;
    gc.innerHTML = `<div class="text-center mb-10"><div class="text-[120px] mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.6)]">${c.ico}</div><div class="text-4xl text-cyan-300 font-black drop-shadow-md">"${c.es.toUpperCase()}" en inglés es...</div><button class="bocina mt-8" onclick="hablarIngles('${c.en}')">🔊</button></div><div class="text-center text-7xl font-black tracking-[0.4em] mb-12 min-h-[90px] text-yellow-400 bg-black/40 py-6 rounded-[40px] max-w-2xl mx-auto border-2 border-yellow-400/30 shadow-inner">${el.map(i => letras[i]).join('')}</div><div id="spLetras" class="flex flex-wrap justify-center gap-6 max-w-3xl mx-auto mb-10"></div><div class="text-center"><button class="btn mr-6" onclick="cargarJ()">🔄 Nueva Palabra</button><button class="btn border-red-500 hover:border-red-400 text-red-100" onclick="el=[];dib()">↩️ Borrar Todo</button></div>`;
    const cont = document.getElementById('spLetras');
    letras.forEach((l, i) => {
      if (el.includes(i)) return;
      const b = document.createElement('button'); b.className = 'w-20 h-20 rounded-[20px] flex items-center justify-center font-black text-5xl bg-white/10 hover:bg-cyan-500 hover:scale-110 border-2 border-white/30 transition-all cursor-pointer text-white shadow-xl'; b.textContent = l;
      b.onclick = () => {
        if(myRun !== runId) return;
        sonido.click(); el.push(i); const arm = el.map(x => letras[x]).join('');
        if (arm.length === letrasStr.length) {
          if (arm === letrasStr) { sonido.ganar(); conf(50); ganarMonedas(8); hablarIngles(c.en); hablarWoody("¡Spelling perfecto! 🐝"); setTimeout(() => { if(myRun === runId) cargarJ(); }, 2500); }
          else { sonido.no(); hablarWoody("Oops. Revisa las letras."); setTimeout(() => { if(myRun === runId){ el=[]; dib(); } }, 1500); return; }
        } dib();
      }; cont.appendChild(b);
    });
  }; dib();
}

// ==========================================
// DICCIONARIOS Y LOGICA DE PREGUNTAS (60 JUEGOS TOTALES)
// ==========================================

const GEN = {};
// Helpers rápidos para generar matemáticas y lógica
GEN.g1 = () => { const a=ri(1,10), b=ri(1,10); return { p: `¿Cuánto es <span class="text-yellow-400">${a} + ${b}</span>?`, opts: O(a+b, [a+b+1, a+b-1, a+b+2]).opts, ok: O(a+b, [a+b+1, a+b-1, a+b+2]).ok }; };
GEN.g2 = () => { const a=ri(10,20), b=ri(1,9); return { p: `¿Cuánto es <span class="text-pink-400">${a} - ${b}</span>?`, opts: O(a-b, [a-b+1, a-b-1, a-b+2]).opts, ok: O(a-b, [a-b+1, a-b-1, a-b+2]).ok }; };
GEN.g3 = () => { const a=ri(2,5), b=ri(2,5); return { p: `¿Cuánto es <span class="text-cyan-400">${a} × ${b}</span>?`, opts: O(a*b, [a*b+a, a*b-b, a*b+1]).opts, ok: O(a*b, [a*b+a, a*b-b, a*b+1]).ok }; };
GEN.g4 = () => { const r=O("Impar", ["Par"]); return { p: `¿El número <span class="text-yellow-400">7</span> es par o impar?`, opts: r.opts, ok: r.ok }; };
GEN.g5 = () => { const r=O("99", ["10", "11", "90"]); return { p: `¿Cuál es el número más <span class="text-pink-400">GRANDE</span> de dos cifras?`, opts: r.opts, ok: r.ok }; };
GEN.g6 = () => { const r=O("El Perro", ["El Pez", "El Pájaro"]); return { p: `¿Qué animal tiene <span class="text-cyan-400">CUATRO</span> patas?`, opts: r.opts, ok: r.ok }; };
GEN.g7 = () => { const r=O("D", ["E", "F", "B"]); return { p: `¿Qué letra sigue después de la <span class="text-yellow-400">"C"</span>?`, opts: r.opts, ok: r.ok }; };
GEN.g8 = () => { const r=O("Invierno", ["Verano", "Primavera", "Otoño"]); return { p: `¿En qué estación hace <span class="text-cyan-400">FRÍO</span>?`, opts: r.opts, ok: r.ok }; };
GEN.g9 = () => { const r=O("Verde", ["Rojo", "Negro", "Violeta"]); return { p: `Amarillo + Azul forman color...`, opts: r.opts, ok: r.ok }; };
GEN.g10= () => { const r=O("Dog", ["Cat", "Bird", "Fish"]); return { p: `¿Cómo se dice <span class="text-yellow-400">Perro</span> en Inglés?`, opts: r.opts, ok: r.ok, en:"Dog" }; };

// Asignamos las funciones interactivas a la lista (GEN.g11 a GEN.g18)
GEN.g11 = () => ({ especial: 'memoria' });
GEN.g12 = () => ({ especial: 'rompe' });
GEN.g13 = () => ({ especial: 'simon' });
GEN.g14 = () => ({ especial: 'arcade' });
GEN.g15 = () => ({ especial: 'pizarra' });
GEN.g16 = () => ({ especial: 'piano' });
GEN.g17 = () => ({ especial: 'ahorcado' });
GEN.g18 = () => ({ especial: 'spelling' });

// Para completar los 60 juegos, clonaremos generadores dinámicos para rellenar la matriz con variaciones.
for(let i=19; i<=60; i++) {
  GEN[`g${i}`] = () => {
    const tipos = [GEN.g1, GEN.g2, GEN.g3, GEN.g10]; // Sumas, Restas, Multi, Inglés dinámico
    return rp(tipos)(); 
  };
}

// ESTRUCTURA FINAL DE CATEGORÍAS Y JUEGOS
const CATS = ["🔢 Matemáticas", "🧠 Memoria y Lógica", "🎨 Arte y Arcade", "🔤 Letras e Inglés", "🚀 Desafíos", "🌟 Explorador"];
const JUEGOS = [
  {c:0, n:"➕ Sumas", g:"g1"}, {c:0, n:"➖ Restas", g:"g2"}, {c:0, n:"✖️ Multiplicar", g:"g3"}, {c:0, n:"🔘 Par o Impar", g:"g4"}, {c:0, n:"⚖️ El Mayor", g:"g5"},
  ...Array.from({length:5}, (_,i)=>({c:0, n:`Desafío Math ${i+1}`, g:`g${19+i}`})),
  
  {c:1, n:"🃏 Memoria 3D", g:"g11"}, {c:1, n:"🧩 Rompecabezas", g:"g12"}, {c:1, n:"🎮 Simón Dice", g:"g13"}, {c:1, n:"🕵️ Animales", g:"g6"}, {c:1, n:"❄️ Estaciones", g:"g8"},
  ...Array.from({length:5}, (_,i)=>({c:1, n:`Lógica Nivel ${i+1}`, g:`g${24+i}`})),

  {c:2, n:"⭐ Atrapa Estrellas", g:"g14"}, {c:2, n:"🎨 Pizarra Mágica", g:"g15"}, {c:2, n:"🎹 Piano Galáctico", g:"g16"}, {c:2, n:"🌈 Colores", g:"g9"},
  ...Array.from({length:6}, (_,i)=>({c:2, n:`Arte Misión ${i+1}`, g:`g${29+i}`})),

  {c:3, n:"😵 Ahorcado", g:"g17"}, {c:3, n:"🐝 Spelling", g:"g18"}, {c:3, n:"🔤 Abecedario", g:"g7"}, {c:3, n:"🐶 Inglés Básico", g:"g10"},
  ...Array.from({length:6}, (_,i)=>({c:3, n:`English Nivel ${i+1}`, g:`g${35+i}`})),

  ...Array.from({length:10}, (_,i)=>({c:4, n:`Cohete ${i+1}`, g:`g${41+i}`})),
  ...Array.from({length:10}, (_,i)=>({c:5, n:`Galaxia ${i+1}`, g:`g${51+i}`}))
];

function dibCats() {
  document.getElementById('cats').innerHTML = CATS.map((n, i) => `<button class="btn ${i === CA ? 'on' : 'border-white/20'}" data-c="${i}">${n}</button>`).join('');
  document.querySelectorAll('#cats button').forEach(b => b.onclick = () => { sonido.click(); CA = +b.dataset.c; dibTabs(); });
}
function dibTabs() {
  const js = JUEGOS.filter(j => j.c === CA); if(js.length > 0) J = JUEGOS.indexOf(js[0]);
  document.getElementById('tabs').innerHTML = js.map(x => `<button class="tab-btn ${JUEGOS.indexOf(x) === J ? 'active' : ''}" data-j="${JUEGOS.indexOf(x)}">${x.n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { 
    sonido.click(); J = +b.dataset.j; 
    document.querySelectorAll('#tabs button').forEach(tb => tb.classList.remove('active')); 
    b.classList.add('active'); cargarJ(); 
  }); 
  cargarJ();
}
function cargarJ() {
  runId++; 
  const j = JUEGOS[J];
  document.getElementById('juegos').innerHTML = `<h2 class="text-4xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 mb-12 text-center tracking-tight drop-shadow-sm uppercase">${j.n}</h2><div id="gameContainer" class="animate-[popIn_0.5s_cubic-bezier(0.34,1.56,0.64,1)]"></div>`;
  const d = GEN[j.g]();
  
  if (d && d.especial) {
    if (d.especial === 'memoria') jMemoria();
    else if (d.especial === 'rompe') jRompe();
    else if (d.especial === 'simon') jSimon();
    else if (d.especial === 'arcade') jArcade();
    else if (d.especial === 'pizarra') jPizarra();
    else if (d.especial === 'piano') jPiano();
    else if (d.especial === 'ahorcado') jAhorcado();
    else if (d.especial === 'spelling') jSpelling();
  } else {
    quiz({ p: d.p, opts: d.opts, ok: d.ok, en: d.en, ico: d.ico, next: cargarJ });
  }
}

window.onload = () => {
  cargarPerfil(); dibCats(); dibTabs();
  setTimeout(() => { document.getElementById('intro').style.opacity = 0; setTimeout(() => document.getElementById('intro').remove(), 1000); hablarWoody("¡Hola! Soy Woody. ¡Preparate para la aventura Ultimate!"); }, 2500);
  setTimeout(() => document.getElementById('barraCarga').style.width = '100%', 200);
};
</script>
