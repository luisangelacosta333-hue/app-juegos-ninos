<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚀 Woody Planet · 60 Juegos Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --bg-dark: #070314; --glass-border: rgba(255, 255, 255, 0.1); --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); --accent-cyan: #06b6d4; --accent-purple: #8b5cf6; }
* { font-family: 'Nunito', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; padding: 0; min-height: 100vh; color: #fff; overflow-x: hidden; scroll-behavior: smooth; }
body { background: var(--bg-dark); }
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; }
body::before { background: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 50%), radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.15), transparent 50%); animation: bgPulse 10s ease-in-out infinite alternate; }
body::after { background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.3; }
@keyframes bgPulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
.vidrio { position: relative; background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 32px; padding: 40px 24px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.2); }
.vidrio-fino { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03)); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.vidrio-fino:hover { transform: translateY(-3px); background: rgba(255,255,255,0.12); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
.tit-neon { font-family: 'Orbitron', sans-serif; font-weight: 900; background: linear-gradient(90deg, #22d3ee, #c084fc, #f472b6, #fde047, #22d3ee); background-size: 300% 100%; -webkit-background-clip: text; color: transparent; animation: nm 6s linear infinite; filter: drop-shadow(0 0 15px rgba(167,139,250,0.4)); }
@keyframes nm { to { background-position: 300% } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 12px 24px; border-radius: 100px; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.btn:hover { background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08)); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
.btn:active { transform: scale(0.95) !important; }
.btn.on { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border-color: rgba(255,255,255,0.5); box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5), inset 0 2px 0 rgba(255,255,255,0.3); }
.tab-btn { padding: 10px 20px; border-radius: 14px; font-size: 0.95rem; font-weight: 800; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; cursor: pointer; transition: all 0.2s; }
.tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateY(-2px); }
.tab-btn.active { background: #facc15; color: #451a03; border-color: #fef08a; box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4); }
.pal { padding: 24px 20px; border-radius: 24px; font-size: 1.4rem; font-weight: 800; cursor: pointer; user-select: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border: 2px solid rgba(255,255,255,0.15); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 120px; text-align: center; line-height: 1.3; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
.pal .ico { font-size: 3.5rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
.pal:hover { transform: translateY(-5px) scale(1.02); border-color: rgba(255,255,255,0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
.pal:active { transform: scale(0.96); }
.ok { background: linear-gradient(135deg, #10b981, #34d399) !important; border-color: #a7f3d0 !important; color: #022c22 !important; box-shadow: 0 0 30px rgba(16, 185, 129, 0.6) !important; animation: pop 0.5s !important; }
.no { background: linear-gradient(135deg, #ef4444, #f87171) !important; border-color: #fecaca !important; color: #450a0a !important; animation: sac 0.45s !important; }
@keyframes pop { 50% { transform: scale(1.08) rotate(-2deg); } }
@keyframes sac { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.btn-oro { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #451a03; border: 2px solid #fde68a; box-shadow: 0 8px 25px rgba(251,191,36,0.5); }
.btn-reward { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; border: 1px solid #fecdd3; box-shadow: 0 8px 25px rgba(225,29,72,0.5); }
.bocina { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: 2px solid #93c5fd; border-radius: 50%; width: 70px; height: 70px; font-size: 2rem; cursor: pointer; box-shadow: 0 8px 25px rgba(59,130,246,0.5); transition: all 0.2s; display: flex; align-items: center; justify-content: center; margin: 0 auto;}
.bocina:hover { transform: scale(1.1) rotate(-10deg); }
.prof { position: fixed; bottom: 15px; right: 15px; z-index: 55; cursor: pointer; width: 90px; height: 120px; animation: flot 3.5s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(34,211,238,0.5)); transition: transform 0.2s; }
.prof:hover { transform: scale(1.1); }
@keyframes flot { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 99000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px; }
.modal-overlay.activo { opacity: 1; pointer-events: auto; }
.globo { position: fixed; bottom: 130px; right: 100px; z-index: 54; max-width: 260px; background: #fff; color: #1e1b4b; padding: 16px 20px; border-radius: 24px 24px 4px 24px; font-weight: 800; font-size: 1.05rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: apa 0.3s; }
.globo::after { content: ""; position: absolute; bottom: -10px; right: 20px; border: 10px solid transparent; border-top-color: #fff; }
@keyframes apa { from { opacity: 0; transform: translateY(10px) scale(0.9) } }
.est { position: fixed; background: #fff; border-radius: 50%; opacity: 0.5; pointer-events: none; animation: cae linear infinite; box-shadow: 0 0 8px #fff; }
@keyframes cae { 0%{transform:translateY(-10vh);opacity:0} 10%{opacity:0.6} 100%{transform:translateY(110vh);opacity:0} }
.particula { position: fixed; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; z-index: 99998; animation: par 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
@keyframes par { to { transform: translate(var(--tx),var(--ty)) scale(0); opacity: 0 } }
.tecla { flex: 1; margin: 0 2px; border-radius: 0 0 16px 16px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 15px; font-weight: 900; transition: all 0.1s; user-select: none; }
.tecla-blanca { background: linear-gradient(180deg, #ffffff, #e2e8f0); height: 200px; z-index: 1; border: 1px solid #cbd5e1; color: #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.tecla-blanca:active, .tecla-blanca.activa { background: #cbd5e1; transform: translateY(4px); box-shadow: none; }
.tecla-negra { background: linear-gradient(180deg, #1e293b, #020617); height: 120px; width: 44px; margin-left: -22px; margin-right: -22px; z-index: 2; color: #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border-radius: 0 0 10px 10px; }
.tecla-negra:active, .tecla-negra.activa { background: #334155; transform: translateY(4px); }
.carta { aspect-ratio: 1/1; cursor: pointer; perspective: 1000px; user-select: none; }
.carta-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
.carta.girada .carta-inner { transform: rotateY(180deg); }
.cara { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 3rem; box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
.cf { background: linear-gradient(135deg, #1e293b, #334155); color: #94a3b8; border: 2px solid rgba(255,255,255,0.1); }
.ca { transform: rotateY(180deg); background: linear-gradient(135deg, #fef08a, #fcd34d); }
.simon-btn { border-radius: 24px; cursor: pointer; opacity: 0.4; transition: all 0.2s; border: 4px solid rgba(255,255,255,0.1); }
.simon-btn.activo { opacity: 1; transform: scale(1.05); box-shadow: 0 0 40px currentColor; border-color: #fff; }
@media (max-width: 640px) { .prof { width: 75px; height: 100px; bottom: 10px; right: 10px; } .globo { right: 80px; bottom: 110px; font-size: 0.95rem; } .pal { min-height: 90px; padding: 15px; font-size: 1.1rem; } .pal .ico { font-size: 2.8rem; } .btn { min-height: 48px; padding: 10px 18px; font-size: 0.9rem; } }
</style>
</head>
<body>
<div id="intro" class="fixed inset-0 bg-black z-[100000] flex items-center justify-center flex-col transition-opacity duration-700">
  <div class="text-7xl mb-6 drop-shadow-2xl">🚀</div>
  <div class="tit-neon text-4xl md:text-6xl tracking-wider">WOODY PLANET</div>
  <div class="text-cyan-300 mt-4 font-bold text-lg">60 juegos Premium</div>
  <div class="w-64 h-3 bg-white/10 rounded-full mt-10 overflow-hidden"><div class="h-full bg-gradient-to-r from-cyan-400 to-purple-500 w-0 transition-all duration-1000" id="barraCarga"></div></div>
</div>

<div id="estrellas"></div>

<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center gap-3 flex-wrap relative z-10">
  <div class="vidrio-fino p-2 px-4 flex items-center gap-3 cursor-pointer hover:bg-white/10" onclick="mostrarPerfil()">
    <div id="avatarPerfil" class="text-3xl bg-white/10 rounded-full w-12 h-12 flex items-center justify-center">👦</div>
    <div>
      <div id="nomP" class="font-black text-white tracking-wide">Jugador</div>
      <div class="text-sm font-bold text-yellow-400">🪙 <span id="monedasTot">0</span> &nbsp;⭐ <span id="ptsTot">0</span></div>
    </div>
  </div>
  <div class="flex gap-2 flex-wrap">
    <button class="btn btn-reward" onclick="verAnuncio()">🎬 +50 🪙</button>
    <button class="btn bg-white/10" onclick="abrirTienda()">🏪 Tienda</button>
    <button class="btn bg-white/10" onclick="sonido.toggleMusica()" id="btnMus">🔇 Música</button>
  </div>
</div>

<div class="max-w-5xl mx-auto px-3 pt-6 pb-40 relative z-10">
  <div class="flex flex-wrap gap-2 justify-center mb-5 bg-black/20 p-2 rounded-3xl border border-white/5" id="cats"></div>
  <div class="flex flex-wrap gap-2 justify-center mb-8" id="tabs"></div>
  <div id="juegos" class="vidrio min-h-[450px]"></div>
</div>

<div id="prof" class="prof" onclick="hablarWoody()"></div>
<div id="globo" class="globo hidden"></div>
<div id="mascotaFija" class="fixed bottom-4 left-4 z-50 text-5xl hidden drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>

<!-- MODALES -->
<div id="perfilModal" class="modal-overlay"><div class="vidrio max-w-sm w-full p-8 text-center"><h2 class="tit-neon text-3xl mb-6">👦 Perfil</h2><input id="nomPerfil" placeholder="Tu nombre" class="w-full p-4 rounded-xl bg-black/30 border border-white/20 text-white text-center text-xl mb-6 outline-none focus:border-cyan-400 transition-colors"><div id="avatares" class="grid grid-cols-6 gap-2 mb-8"></div><button class="btn btn-oro w-full text-xl py-3" onclick="guardarPerfil()">✅ Guardar</button></div></div>
<div id="tiendaModal" class="modal-overlay"><div class="vidrio max-w-2xl w-full p-8 max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center mb-6"><h2 class="tit-neon text-3xl">🏪 Tienda</h2><button class="w-10 h-10 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition-colors text-xl font-bold border border-red-500/50" onclick="cerrarModal('tiendaModal')">✕</button></div><div class="text-center mb-8 text-2xl font-black text-yellow-400 bg-yellow-400/10 py-3 rounded-2xl border border-yellow-400/20">Tienes: 🪙 <span id="tiendaMonedas">0</span></div><h3 class="text-xl font-black text-pink-400 mb-4 tracking-wide">🐾 MASCOTAS</h3><div id="tiendaMascotas" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8"></div><h3 class="text-xl font-black text-cyan-400 mb-4 tracking-wide">👑 ACCESORIOS</h3><div id="tiendaAccesorios" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div></div></div>
<div id="premioModal" class="modal-overlay z-[99999]"><div class="vidrio max-w-xs w-full p-8 text-center"><div id="premioIcono" class="text-8xl mb-4 drop-shadow-[0_0_20px_rgba(255,255,255,0.5)]">🎁</div><h2 id="premioTexto" class="text-3xl font-black text-yellow-400 mb-8">¡GANASTE!</h2><button class="btn btn-oro px-8 py-3 text-lg" onclick="cerrarModal('premioModal')">¡Genial!</button></div></div>

<script>
let runId = 0; 
const sonido = (() => { let ctx; const ini = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }; const tono = (f = 440, d = 0.2, t = 'sine', v = 0.1) => { ini(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d); }; const mel = arr => arr.forEach(([f, d], n) => setTimeout(() => tono(f, d), n * 140)); return { ini, tono, click: () => tono(600, 0.05, 'square', 0.05), ok: () => mel([[523, 0.1], [659, 0.1], [784, 0.15]]), no: () => mel([[300, 0.15], [200, 0.2]]), ganar: () => mel([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.3]]), moneda: () => tono(1200, 0.1, 'sine', 0.05), toggleMusica() { ini(); this._m = !this._m; document.getElementById('btnMus').textContent = this._m ? '🔊 Música' : '🔇 Música'; if (this._m) { const n = [261, 329, 392, 523]; let i = 0; const lp = () => { if (!this._m) return; tono(n[i % 4], 0.2, 'triangle', 0.02); i++; this._t = setTimeout(lp, 600); }; lp(); } else clearTimeout(this._t); } }; })(); document.addEventListener('click', () => sonido.ini(), { once: true });
function hablarIngles(texto) { try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1; const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
const WOODY = { saludo: ["¡Hola! Soy Woody, tu profe astronauta 🚀", "¡Yo te enseño, vos aprendés jugando! 🌍"], ganar: ["¡Muy bien! ¡Sí se puede! ✨", "¡GENIAL! ¡Lo lograste! 🎉", "¡Bravo! ¡Woody está orgulloso de vos! 🌟"], fallar: ["¡No, vamos, que tú puedes!", "¡Casi! Pensá bien, yo te ayudo 💪", "¡Muy cerca! Intentá de nuevo ✨"] };
function hablarWoody(frase) { const texto = frase || rp(WOODY.saludo); const g = document.getElementById('globo'); g.textContent = texto; g.classList.remove('hidden'); clearTimeout(g._t); g._t = setTimeout(() => g.classList.add('hidden'), 5000); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'es-AR'; u.pitch = 1.3; u.rate = 0.95; speechSynthesis.speak(u); } } catch (e) {} }

let PERFIL = { n: "Jugador", a: "👦", p: 0, monedas: 100, inv: [], eqMascota: null, eqAcc: null }; let CA = 0, J = 0;
const TIENDA = { mascotas: [ { id: 'm1', ico: '🐉', nom: 'Dragón', p: 500 }, { id: 'm2', ico: '🦄', nom: 'Unicornio', p: 800 }, { id: 'm3', ico: '🤖', nom: 'Robot', p: 1200 }, { id: 'm4', ico: '👽', nom: 'Marciano', p: 2000 }, { id: 'm5', ico: '🐱‍🚀', nom: 'Gato Astro', p: 3000 } ], accesorios: [ { id: 'a1', ico: '👑', nom: 'Corona', p: 300 }, { id: 'a2', ico: '🕶️', nom: 'Gafas', p: 400 }, { id: 'a3', ico: '🎩', nom: 'Galera', p: 500 }, { id: 'a4', ico: '🎓', nom: 'Graduado', p: 600 } ] };
function guardarPerfil() { const v = document.getElementById('nomPerfil').value.trim(); if (v) PERFIL.n = v; localStorage.setItem('woodyPlanet', JSON.stringify(PERFIL)); actualizarCabecera(); cerrarModal('perfilModal'); sonido.ok(); } function cargarPerfil() { const s = localStorage.getItem('woodyPlanet'); if (s) PERFIL = { ...PERFIL, ...JSON.parse(s) }; actualizarCabecera(); } function actualizarCabecera() { document.getElementById('nomP').textContent = PERFIL.n; document.getElementById('ptsTot').textContent = PERFIL.p; document.getElementById('monedasTot').textContent = PERFIL.monedas; let av = PERFIL.a; if (PERFIL.eqAcc) av += TIENDA.accesorios.find(x => x.id === PERFIL.eqAcc).ico; document.getElementById('avatarPerfil').textContent = av; const m = document.getElementById('mascotaFija'); if (PERFIL.eqMascota) { m.textContent = TIENDA.mascotas.find(x => x.id === PERFIL.eqMascota).ico; m.classList.remove('hidden'); } else m.classList.add('hidden'); } function ganarMonedas(c) { PERFIL.monedas += c; PERFIL.p += c * 10; localStorage.setItem('woodyPlanet', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.moneda(); } function mostrarPremio(ico, txt) { document.getElementById('premioIcono').textContent = ico; document.getElementById('premioTexto').textContent = txt; abrirModal('premioModal'); } function abrirModal(id) { document.getElementById(id).classList.add('activo'); sonido.click(); } function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); sonido.click(); } function verAnuncio() { ganarMonedas(50); mostrarPremio('🎬', '¡Gracias! +50 🪙'); }
function mostrarPerfil() { document.getElementById('nomPerfil').value = PERFIL.n; const avs = ["👦", "👧", "🧑‍🚀", "👽", "🦊", "🐯"]; document.getElementById('avatares').innerHTML = avs.map(a => `<button class="text-4xl hover:scale-110 transition-transform ${a === PERFIL.a ? 'ring-4 ring-cyan-400 bg-white/20 rounded-2xl' : ''} p-2" onclick="PERFIL.a='${a}';mostrarPerfil()">${a}</button>`).join(''); abrirModal('perfilModal'); }
function abrirTienda() { document.getElementById('tiendaMonedas').textContent = PERFIL.monedas; document.getElementById('tiendaMascotas').innerHTML = TIENDA.mascotas.map(m => { const t = PERFIL.inv.includes(m.id), e = PERFIL.eqMascota === m.id; return `<div class="vidrio-fino p-4 text-center"><div class="text-5xl mb-3">${m.ico}</div><div class="font-bold text-sm mb-3">${m.nom}</div>${t ? `<button class="btn w-full text-sm ${e ? '!bg-green-500' : ''}" onclick="equipar('${m.id}','m')">${e ? 'Puesta' : 'Equipar'}</button>` : `<button class="btn btn-oro w-full text-sm" onclick="comprar('${m.id}',${m.p})">🪙 ${m.p}</button>`}</div>`; }).join(''); document.getElementById('tiendaAccesorios').innerHTML = TIENDA.accesorios.map(a => { const t = PERFIL.inv.includes(a.id), e = PERFIL.eqAcc === a.id; return `<div class="vidrio-fino p-4 text-center"><div class="text-5xl mb-3">${a.ico}</div><div class="font-bold text-sm mb-3">${a.nom}</div>${t ? `<button class="btn w-full text-sm ${e ? '!bg-green-500' : ''}" onclick="equipar('${a.id}','a')">${e ? 'Puesto' : 'Equipar'}</button>` : `<button class="btn btn-oro w-full text-sm" onclick="comprar('${a.id}',${a.p})">🪙 ${a.p}</button>`}</div>`; }).join(''); abrirModal('tiendaModal'); }
function comprar(id, p) { if (PERFIL.monedas >= p) { PERFIL.monedas -= p; PERFIL.inv.push(id); localStorage.setItem('woodyPlanet', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.ganar(); abrirTienda(); mostrarPremio(id.startsWith('m') ? TIENDA.mascotas.find(x => x.id === id).ico : TIENDA.accesorios.find(x => x.id === id).ico, "¡Comprado!"); } else { sonido.no(); alert("No alcanzan las monedas"); } } function equipar(id, t) { if (t === 'm') PERFIL.eqMascota = PERFIL.eqMascota === id ? null : id; else PERFIL.eqAcc = PERFIL.eqAcc === id ? null : id; localStorage.setItem('woodyPlanet', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.click(); abrirTienda(); }
const mezclar = a => [...a].sort(() => Math.random() - 0.5); const rp = a => a[Math.floor(Math.random() * a.length)]; const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const conf = (n = 40) => { const cols = ['#22d3ee', '#a855f7', '#ec4899', '#facc15', '#22c55e']; for (let i = 0; i < n; i++) { const c = document.createElement('div'); c.className = 'particula'; c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = cols[i % cols.length]; c.style.setProperty('--tx', (Math.random() - 0.5) * 250 + 'px'); c.style.setProperty('--ty', Math.random() * 600 + 'px'); document.body.appendChild(c); setTimeout(() => c.remove(), 1000); } };
function O(correcto, erroneas) { const arr = mezclar([correcto, ...erroneas]); return { opts: arr.map(String), ok: arr.indexOf(String(correcto)) }; }

function quiz({ p, opts, ok, en, ico, es, pregunta, respuesta, next }) {
  const gc = document.getElementById('gameContainer');
  gc.innerHTML = `<div class="text-center mb-10 text-2xl md:text-4xl font-black leading-relaxed tracking-wide drop-shadow-md">${p}</div><div id="qOps" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto"></div>`;
  const c = document.getElementById('qOps'); const myRun = runId;
  opts.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'pal';
    const icono = ico ? ico[i] : ''; b.innerHTML = (icono ? `<span class="ico">${icono}</span>` : '') + `<span>${o}</span>`;
    b.onclick = () => {
      if (myRun !== runId) return;
      if (i === ok) { b.classList.add('ok'); sonido.ok(); conf(40); ganarMonedas(3); hablarWoody(rp(WOODY.ganar)); if (en) setTimeout(() => { if (myRun === runId) hablarIngles(en); }, 1800); setTimeout(() => { if (myRun === runId && next) next(); }, 2500); }
      else { b.classList.add('no'); sonido.no(); hablarWoody("¡No, vamos, que tú puedes! La respuesta correcta es " + respuesta + ". ¡La próxima lo lográs!"); if (es && en) setTimeout(() => { if (myRun === runId) hablarIngles(en); }, 2800); }
    }; c.appendChild(b);
  });
  if (pregunta) setTimeout(() => { if (myRun === runId) hablarWoody(pregunta); }, 500);
}

  const dt = () => { document.getElementById('ahP').textContent = prog.join(''); document.getElementById('ahV').textContent = '❤️'.repeat(Math.max(0, max - err)) + '🖤'.repeat(err); };

    const b = document.createElement('button'); b.className = 'w-12 h-12 rounded-xl bg-white/10 text-xl font-black border border-white/20 hover:scale-110 hover:bg-white/20 transition-all'; b.textContent = l;

        word.split('').forEach((x, i) => { if (x === l) prog[i] = l; });
        if (!prog.includes('_')) { over = true; sonido.ganar(); conf(40); hablarWoody("¡Adivinaste la palabra! 🏆"); ganarMonedas(8); setTimeout(() => { if (myRun === runId) cargarJ(); }, 2000); }

  const t = rp(['animales','comida','colores','cuerpo','familia','ropa','casa','transporte']);
  const c = rp(DIC[t]);
  const letrasStr = c.en.toUpperCase().replace(/\s/g, ''); const letras = mezclar(letrasStr.split(''));
  let el = []; const myRun = runId;
  const dib = () => {
    if(myRun !== runId) return;
    gc.innerHTML = `<div class="text-center mb-6"><div class="text-8xl mb-4 drop-shadow-xl">${c.ico || ''}</div><div class="text-2xl text-cyan-300 font-bold">"${c.es.toUpperCase()}" en inglés es...</div><button class="bocina mt-6" onclick="hablarIngles('${c.en}')">🔊</button></div><div class="text-center text-5xl font-black tracking-[0.3em] mb-8 min-h-[70px] text-yellow-400 bg-black/30 py-4 rounded-2xl max-w-md mx-auto border border-yellow-400/20">${el.map(i => letras[i]).join('')}</div><div id="spLetras" class="flex flex-wrap justify-center gap-4 max-w-2xl mx-auto mb-8"></div><div class="text-center"><button class="btn mr-4" onclick="cargarJ()">🔄 Nueva</button><button class="btn bg-red-500/20 border-red-500/50" onclick="el=[];dib()">↩️ Borrar</button></div>`;
    hablarWoody(`Deletreá "${c.es}" en inglés. ¡Vos podés!`);
    const cont = document.getElementById('spLetras');
    letras.forEach((l, i) => {
      if (el.includes(i)) return;
      const b = document.createElement('button'); b.className = 'w-16 h-16 rounded-2xl flex items-center justify-center font-black text-3xl bg-white/10 hover:bg-cyan-500 hover:scale-110 border-2 border-white/20 transition-all cursor-pointer'; b.textContent = l;
      b.onclick = () => {
        if(myRun !== runId) return;
        sonido.click(); el.push(i); const arm = el.map(x => letras[x]).join('');
        if (arm.length === letrasStr.length) {
          if (arm === letrasStr) { sonido.ganar(); conf(); ganarMonedas(6); hablarIngles(c.en); hablarWoody("¡Deletreaste perfecto! 🐝"); setTimeout(() => { if(myRun === runId) cargarJ(); }, 2000); }
          else { sonido.no(); hablarWoody("Oops. Intenta de nuevo."); setTimeout(() => { if(myRun === runId){ el=[]; dib(); } }, 1000); return; }
        } dib();
      }; cont.appendChild(b);
    });
  }; dib();
}

}
