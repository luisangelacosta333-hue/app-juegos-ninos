<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚀 Zeta Planet · Premium Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   VARIABLES GLOBALES Y TEMA SUPER PREMIUM
   ========================================================================== */
:root {
  --bg-deep: #0a051c;
  --bg-stars: #160a3a;
  --c-cyan: #00e5ff; --c-cyan-d: #009eb3; --c-cyan-glow: rgba(0, 229, 255, 0.6);
  --c-pink: #ff007f; --c-pink-d: #b30059; --c-pink-glow: rgba(255, 0, 127, 0.6);
  --c-yellow: #ffea00; --c-yellow-d: #ccbb00; --c-yellow-glow: rgba(255, 234, 0, 0.6);
  --c-green: #00e676; --c-green-d: #00a152; --c-green-glow: rgba(0, 230, 118, 0.6);
  --c-purple: #9d00ff; --c-purple-d: #5e0099; --c-purple-glow: rgba(157, 0, 255, 0.6);
  --c-orange: #ff6a00; --c-orange-d: #b34a00; --c-orange-glow: rgba(255, 106, 0, 0.6);
}

* { font-family: 'Nunito', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-deep); color: #fff; cursor: default; }

/* Efectos de Fondo y Animaciones Base */
#galaxy-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 30% 70%, var(--bg-stars), var(--bg-deep)); }
.star-layer-1 { position: fixed; width: 200vw; height: 200vh; top: -50vh; left: -50vw; background-image: radial-gradient(#fff 2px, transparent 2px); background-size: 150px 150px; opacity: 0.3; animation: rotarLento 150s linear infinite; z-index: -2; }
.star-layer-2 { position: fixed; width: 200vw; height: 200vh; top: -50vh; left: -50vw; background-image: radial-gradient(#fff 1.5px, transparent 1.5px); background-size: 100px 100px; opacity: 0.2; animation: rotarLento 100s linear infinite reverse; z-index: -2; }
@keyframes rotarLento { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.tit-magico { font-family: 'Fredoka One', cursive; text-transform: uppercase; text-shadow: 0 8px 0 rgba(0,0,0,0.4), 0 0 30px rgba(255,255,255,0.4); letter-spacing: 3px; }

/* Layout y Barra Superior */
#app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; z-index: 10; }
#top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.3); backdrop-filter: blur(25px); border-bottom: 5px solid rgba(255,255,255,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 50; }
.hud-item { display: flex; align-items: center; gap: 15px; }

.level-badge { background: linear-gradient(135deg, var(--c-yellow), var(--c-orange)); color: #331a00; font-family: 'Fredoka One'; padding: 12px 30px; border-radius: 40px; font-size: 2rem; border: 5px solid #fff; box-shadow: 0 8px 0 var(--c-orange-d), 0 0 25px var(--c-yellow-glow); transition: 0.3s; }
.xp-wrapper { flex-grow: 1; max-width: 600px; margin: 0 30px; position: relative; }
.xp-bar-container { height: 35px; background: rgba(0,0,0,0.6); border-radius: 30px; border: 4px solid rgba(255,255,255,0.4); overflow: hidden; box-shadow: inset 0 5px 15px rgba(0,0,0,0.8); }
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--c-cyan), var(--c-purple), var(--c-pink)); width: 0%; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: inset 0 8px 10px rgba(255,255,255,0.5); }
.coins-badge { background: linear-gradient(135deg, var(--c-purple), var(--c-pink)); color: #fff; padding: 12px 30px; border-radius: 40px; font-size: 2rem; font-family: 'Fredoka One'; border: 5px solid #fff; box-shadow: 0 8px 0 var(--c-purple-d), 0 0 25px var(--c-pink-glow); }

/* Vistas Dinámicas */
#main-view { flex-grow: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; }
.view-section { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.7s; padding: 20px; }
.view-hidden-left { transform: translateX(-150%) scale(0.7) rotateY(-30deg); opacity: 0; pointer-events: none; }
.view-hidden-right { transform: translateX(150%) scale(0.7) rotateY(30deg); opacity: 0; pointer-events: none; }
.view-active { transform: translateX(0) scale(1) rotateY(0deg); opacity: 1; pointer-events: auto; }

/* Carrusel y Categorías */
.carousel-wrapper { width: 100%; max-width: 1600px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
.carousel-track { display: flex; gap: 40px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 40px 60px; width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none; perspective: 1000px; }
.carousel-track::-webkit-scrollbar { display: none; }

.card-mundo { scroll-snap-align: center; flex: 0 0 auto; width: 340px; height: 450px; border-radius: 50px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); border: 8px solid #fff; background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); backdrop-filter: blur(20px); box-shadow: 0 20px 0 rgba(0,0,0,0.3), 0 30px 60px rgba(0,0,0,0.6); position: relative; overflow: hidden; transform-style: preserve-3d; }
.card-mundo:hover { transform: translateY(-25px) scale(1.08) rotateX(10deg); z-index: 10; }
.card-mundo:active { transform: translateY(10px) scale(0.95); box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.5); }
.mundo-ico { font-size: 8rem; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateZ(50px); }
.card-mundo:hover .mundo-ico { transform: translateZ(80px) scale(1.2) rotate(15deg); }
.mundo-tit { font-family: 'Fredoka One'; font-size: 2.8rem; text-align: center; text-shadow: 0 5px 0 rgba(0,0,0,0.5); transform: translateZ(30px); line-height: 1.1; }

.cat-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; background: rgba(0,0,0,0.4); padding: 20px 40px; border-radius: 50px; border: 4px solid rgba(255,255,255,0.1); }
.tab-btn { padding: 15px 35px; border-radius: 40px; font-family: 'Fredoka One'; font-size: 1.6rem; color: #fff; border: 4px solid rgba(255,255,255,0.3); cursor: pointer; transition: 0.3s; box-shadow: 0 8px 0 rgba(0,0,0,0.4); text-transform: uppercase; }
.tab-btn.active { background: var(--c-yellow); color: #4a2500; border-color: #fff; box-shadow: 0 8px 0 var(--c-yellow-d); }

/* Estilos de Opciones de Juego */
.juego-tit { font-size: clamp(3rem, 6vw, 6rem); text-align: center; margin-bottom: 50px; padding: 0 30px; text-shadow: 0 8px 20px rgba(0,0,0,0.6); max-width: 1400px; line-height: 1.2; }
.grid-opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; width: 95%; max-width: 1400px; margin: 0 auto; }
.btn-opcion { background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); border: 8px solid #fff; border-radius: 50px; padding: 40px; font-family: 'Fredoka One'; font-size: 4rem; color: #fff; cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 20px 0 rgba(0,0,0,0.3), 0 30px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 250px; position: relative; overflow: hidden; }
.btn-opcion:hover { transform: translateY(-15px) scale(1.02); background: rgba(255,255,255,0.25); box-shadow: 0 35px 0 rgba(0,0,0,0.4), 0 40px 60px rgba(0,0,0,0.7); }
.btn-opcion:active { transform: translateY(15px); box-shadow: 0 5px 0 rgba(0,0,0,0.3); }
.btn-opcion .ico { font-size: 8rem; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5)); transition: 0.3s; }

.correct-btn { background: var(--c-green) !important; box-shadow: 0 20px 0 var(--c-green-d), 0 0 80px var(--c-green-glow) !important; animation: popWin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important; border-color: #fff !important; z-index: 10; }
.wrong-btn { background: var(--c-pink) !important; box-shadow: 0 10px 0 var(--c-pink-d), 0 0 50px var(--c-pink-glow) !important; opacity: 0.6; transform: scale(0.9) translateY(10px) !important; border-color: rgba(255,255,255,0.5) !important; animation: shakeErr 0.5s !important; }
@keyframes popWin { 0% { transform: scale(1); } 40% { transform: scale(1.2) translateY(-30px); } 100% { transform: scale(1.1) translateY(-15px); } }
@keyframes shakeErr { 10%, 90% { transform: translateX(-5px) scale(0.9); } 20%, 80% { transform: translateX(10px) scale(0.9); } 30%, 50%, 70% { transform: translateX(-20px) scale(0.9); } 40%, 60% { transform: translateX(20px) scale(0.9); } }

/* Botones de Acción (Volver, Bocina) */
.action-bar { position: absolute; top: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between; z-index: 40; pointer-events: none; }
.btn-volver { pointer-events: auto; background: var(--c-yellow); color: #4a2500; border: 6px solid #fff; border-radius: 60px; padding: 20px 40px; font-family: 'Fredoka One'; font-size: 2.2rem; cursor: pointer; box-shadow: 0 12px 0 var(--c-yellow-d); transition: 0.2s; display: flex; align-items: center; gap: 15px; }
.btn-volver:active { transform: translateY(12px); box-shadow: 0 0 0 var(--c-yellow-d); }
.bocina-btn { pointer-events: auto; background: var(--c-cyan); color: #fff; box-shadow: 0 12px 0 var(--c-cyan-d); padding: 20px; border-radius: 50%; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; font-size: 3.5rem; border: 6px solid #fff; cursor: pointer; transition: 0.2s; animation: pulseGlow 2s infinite; }
.bocina-btn:active { transform: translateY(12px) scale(0.9); box-shadow: 0 0 0 var(--c-cyan-d); }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 12px 0 var(--c-cyan-d), 0 0 20px var(--c-cyan-glow); } 50% { box-shadow: 0 12px 0 var(--c-cyan-d), 0 0 50px var(--c-cyan); } }

/* ==========================================================================
   MASCOTA: ZETA EL MARCIANITO (SVG ANIMADO)
   ========================================================================== */
#mascot-container { position: fixed; bottom: 40px; right: 40px; z-index: 100; cursor: pointer; animation: floatMascot 4s ease-in-out infinite; filter: drop-shadow(0 25px 30px rgba(0,0,0,0.7)); }
@keyframes floatMascot { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-30px) rotate(3deg); } }

.zeta-bubble { position: fixed; bottom: 260px; right: 180px; max-width: 550px; background: rgba(255,255,255,0.98); padding: 35px 45px; border-radius: 50px 50px 10px 50px; border: 8px solid var(--c-cyan); font-family: 'Fredoka One'; font-size: 2.2rem; color: #1a0b2e; box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px var(--c-cyan-glow); z-index: 99; transform-origin: bottom right; animation: bubblePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); line-height: 1.3; }
.zeta-bubble::after { content: ''; position: absolute; bottom: -30px; right: 40px; border: 30px solid transparent; border-top-color: var(--c-cyan); border-right-color: var(--c-cyan); }
.zeta-bubble::before { content: ''; position: absolute; bottom: -15px; right: 48px; border: 18px solid transparent; border-top-color: #fff; border-right-color: #fff; z-index: 1; }
@keyframes bubblePop { 0% { transform: scale(0) rotate(20deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

/* Partículas */
.sparkle { position: absolute; border-radius: 50%; pointer-events: none; animation: sparkAnim 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards; box-shadow: 0 0 15px currentColor; z-index: 99999; }
@keyframes sparkAnim { 0% { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg); opacity: 0; } }

/* Modales */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,2,15,0.95); backdrop-filter: blur(30px); z-index: 99000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px; }
.modal-overlay.activo { opacity: 1; pointer-events: auto; }
.modal-box { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border: 6px solid rgba(255,255,255,0.2); border-radius: 60px; padding: 60px; box-shadow: 0 30px 80px rgba(0,0,0,0.8); width: 100%; max-width: 1200px; max-height: 90vh; overflow-y: auto; position: relative; }
.modal-box::-webkit-scrollbar { display: none; }
.btn-close { position: absolute; top: 30px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: #ef4444; border: 6px solid #b91c1c; color: white; font-size: 3rem; cursor: pointer; box-shadow: 0 8px 0 #991b1b; display: flex; align-items: center; justify-content: center; z-index: 10; }
.btn-close:active { transform: translateY(8px); box-shadow: 0 0 0 #991b1b; }

@media (max-width: 1024px) {
  #top-bar { padding: 15px 20px; } .level-badge, .coins-badge { padding: 10px 20px; font-size: 1.5rem; }
  .card-mundo { width: 300px; height: 400px; padding: 20px; } .mundo-ico { font-size: 6rem; } .mundo-tit { font-size: 2.2rem; }
  .juego-tit { font-size: 3.5rem; } .btn-opcion { padding: 30px; font-size: 2.8rem; min-height: 200px; } .btn-opcion .ico { font-size: 6rem; }
  #mascot-container { right: 20px; bottom: 20px; transform: scale(0.8); } .zeta-bubble { right: 120px; bottom: 180px; font-size: 1.6rem; max-width: 400px; }
}
@media (max-width: 768px) {
  .btn-opcion { padding: 20px; font-size: 2rem; min-height: 150px; border-width: 5px; } .btn-opcion .ico { font-size: 4rem; }
  .action-bar { top: 15px; left: 15px; right: 15px; } .btn-volver { padding: 12px 25px; font-size: 1.5rem; } .bocina-btn { width: 70px; height: 70px; font-size: 2.5rem; }
  #mascot-container { transform: scale(0.6); right: 0; bottom: 0; } .zeta-bubble { right: 60px; bottom: 140px; font-size: 1.3rem; max-width: 300px; }
  .modal-box { padding: 30px; border-radius: 40px; } .btn-close { width: 60px; height: 60px; font-size: 2rem; }
}
</style>
</head>
<body>

<div id="galaxy-bg"></div>
<div class="star-layer-1"></div>
<div class="star-layer-2"></div>

<!-- INTRO DE CARGA REPARADA Y BLINDADA CON EL NUEVO PERSONAJE -->
<div id="intro" class="fixed inset-0 bg-black z-[100000] flex items-center justify-center flex-col transition-opacity duration-[1500ms]">
  <div class="w-64 h-64 mb-10 animate-bounce drop-shadow-[0_0_50px_rgba(0,229,255,0.8)]">
    <!-- SVG del Personaje para la Intro -->
    <svg viewBox="0 0 200 250" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
      <g class="animate-pulse"><path d="M80,180 Q100,260 120,180 Z" fill="#ffea00" /><path d="M90,180 Q100,230 110,180 Z" fill="#ff007f" /></g>
      <rect x="65" y="90" width="70" height="90" rx="15" fill="#9d00ff" stroke="#fff" stroke-width="4"/>
      <rect x="75" y="110" width="50" height="70" rx="25" fill="#00e5ff" stroke="#fff" stroke-width="4"/>
      <path d="M75,130 Q50,140 60,160" fill="none" stroke="#00e5ff" stroke-width="14" stroke-linecap="round"/>
      <path d="M125,130 Q150,140 140,160" fill="none" stroke="#00e5ff" stroke-width="14" stroke-linecap="round"/>
      <circle cx="100" cy="80" r="55" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="4"/>
      <ellipse cx="100" cy="85" rx="35" ry="30" fill="#00e676" stroke="#008b46" stroke-width="3"/>
      <circle cx="85" cy="80" r="10" fill="#160a3a"/> <circle cx="88" cy="77" r="3" fill="#fff"/>
      <circle cx="115" cy="80" r="10" fill="#160a3a"/> <circle cx="112" cy="77" r="3" fill="#fff"/>
      <path d="M90,100 Q100,110 110,100" fill="none" stroke="#160a3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M100,55 L100,35" stroke="#00e676" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="30" r="6" fill="#ffea00"/>
    </svg>
  </div>
  <div class="tit-magico text-6xl md:text-9xl text-center text-white">ZETA PLANET</div>
  <div class="text-yellow-300 mt-8 font-black text-3xl md:text-5xl tracking-[0.3em] uppercase drop-shadow-lg font-['Fredoka_One']">Ultimate Academy</div>
  <div class="w-[80vw] max-w-[600px] h-10 bg-white/10 rounded-full mt-20 border-6 border-white/40 p-2"><div class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 w-0 transition-all duration-[1000ms] shadow-[0_0_30px_rgba(255,0,127,1)]" id="barraCarga"></div></div>
</div>

<div id="app-container">
  <!-- HUD SUPERIOR -->
  <div id="top-bar">
    <div class="hud-item cursor-pointer hover:scale-105 transition-transform" onclick="mostrarPerfil()">
      <div id="avatarPerfil" class="text-5xl bg-white/20 rounded-full w-20 h-20 flex items-center justify-center border-4 border-white shadow-[0_0_20px_rgba(255,255,255,0.5)]">👦</div>
      <div class="level-badge" id="lvl-txt">Lvl 1</div>
    </div>
    <div class="xp-wrapper"><div class="xp-bar-container"><div class="xp-bar-fill" id="xp-bar"></div></div></div>
    <div class="hud-item">
      <div class="coins-badge">🪙 <span id="coin-txt">0</span></div>
    </div>
  </div>

  <!-- VISTAS DINAMICAS SIN SCROLL -->
  <div id="main-view">
    <div id="view-menu" class="view-section view-active">
      <div class="cat-tabs mb-10" id="tabs-categorias"></div>
      <div class="carousel-wrapper">
        <div class="carousel-track" id="mundos-carrusel"></div>
      </div>
    </div>

    <div id="view-game" class="view-section view-hidden-right">
      <div class="action-bar">
        <button class="btn-volver" onclick="volverMenu()">🔙 Regresar</button>
        <button class="bocina-btn" id="btn-audio-repeat" style="display:none;">🔊</button>
      </div>
      <div class="juego-tit tit-magico" id="juego-pregunta"></div>
      <div class="grid-opciones" id="juego-opciones"></div>
    </div>
  </div>
</div>

<!-- MASCOTA FLOTANTE: ZETA EL MARCIANITO (SVG) -->
<div id="mascot-container" onclick="zetaSaluda()">
  <svg width="220" height="280" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
    <!-- Llamas del propulsor -->
    <g class="animate-pulse">
      <path d="M80,180 Q100,260 120,180 Z" fill="#ffea00" />
      <path d="M90,180 Q100,230 110,180 Z" fill="#ff007f" />
    </g>
    <!-- Mochila -->
    <rect x="65" y="90" width="70" height="90" rx="15" fill="#9d00ff" stroke="#fff" stroke-width="4"/>
    <!-- Cuerpo -->
    <rect x="75" y="110" width="50" height="70" rx="25" fill="#00e5ff" stroke="#fff" stroke-width="4"/>
    <!-- Brazos -->
    <path d="M75,130 Q50,140 60,160" fill="none" stroke="#00e5ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M125,130 Q150,140 140,160" fill="none" stroke="#00e5ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Casco Cristal -->
    <circle cx="100" cy="80" r="55" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="4"/>
    <!-- Cabeza Marciano -->
    <ellipse cx="100" cy="85" rx="35" ry="30" fill="#00e676" stroke="#008b46" stroke-width="3"/>
    <!-- Ojos -->
    <circle cx="85" cy="80" r="10" fill="#160a3a"/> <circle cx="88" cy="77" r="3" fill="#fff"/>
    <circle cx="115" cy="80" r="10" fill="#160a3a"/> <circle cx="112" cy="77" r="3" fill="#fff"/>
    <!-- Sonrisa y Antena -->
    <path d="M90,100 Q100,110 110,100" fill="none" stroke="#160a3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M100,55 L100,35" stroke="#00e676" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="30" r="6" fill="#ffea00"/>
    <path d="M60,60 Q100,20 140,60" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </svg>
</div>
<div id="zeta-globo" class="zeta-bubble hidden"></div>

<!-- Modales -->
<div id="perfilModal" class="modal-overlay">
  <div class="modal-box text-center">
    <button class="btn-close" onclick="cerrarModal('perfilModal')">✕</button>
    <h2 class="tit-magico text-7xl mb-12">Tu Piloto</h2>
    <input id="nomPerfil" placeholder="Tu nombre" class="w-full p-8 rounded-[40px] bg-black/60 border-8 border-white/40 text-white text-center text-5xl mb-12 outline-none font-['Fredoka_One']">
    <div id="avatares" class="grid grid-cols-3 gap-8 mb-14"></div>
    <button class="btn-3d btn-yellow w-full" onclick="guardarPerfil()">✅ Guardar Piloto</button>
  </div>
</div>
<script>
// ==========================================================================
// 1. SISTEMA CORE, AUDIO, PARTICULAS Y VOZ
// ==========================================================================
let runId = 0; // Evita cruce de clics y callbacks en la transición de juegos

function crearChispas(x, y, color = '#00e5ff') {
  for(let i=0; i<20; i++) {
    const p = document.createElement('div'); p.className = 'sparkle';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.background = color; p.style.width = (Math.random()*15+5)+'px'; p.style.height = p.style.width;
    const angle = Math.random() * Math.PI * 2; const dist = Math.random() * 200 + 50;

function fuegosArtificiales(x, y) {

const AudioSys = (() => {
  let ctx; let enabled = true;
  const init = () => { if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); };
  const play = (f, d, t, v) => { if(!enabled) return; init(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d); };
  return {
    init, click: () => play(800, 0.05, 'sine', 0.1),
    win: () => { play(523.2, 0.1, 'triangle', 0.1); setTimeout(()=>play(659.2, 0.1, 'triangle', 0.1), 100); setTimeout(()=>play(1046.5, 0.4, 'triangle', 0.15), 200); },
    lose: () => { play(300, 0.2, 'sawtooth', 0.1); setTimeout(()=>play(200, 0.4, 'sawtooth', 0.1), 150); },
    coin: () => play(1200, 0.1, 'sine', 0.05),
    toggle: () => { enabled = !enabled; return enabled; }
  };
})();
document.body.addEventListener('click', AudioSys.init, {once:true});

function hablar(texto, lang = 'es-AR') {
  try {
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = lang; u.pitch = 1.4; u.rate = 0.95; 
    speechSynthesis.speak(u);
  } catch(e) {}
}

      const c = document.createElement('div');
      c.className = 'aspect-square rounded-[30px] flex items-center justify-center text-[80px] font-black cursor-pointer transition-all duration-200 ' + (n ? 'bg-gradient-to-br from-cyan-400 to-blue-600 border-8 border-white shadow-[0_15px_0_rgba(0,0,0,0.3)] hover:scale-105 hover:z-10' : 'bg-black/40 border-8 border-dashed border-white/30');
      c.textContent = n ? ["🪐","🌍","🌕","🌞","🛸","☄️","🚀","🛰️"][n-1] : '';
      if (n) c.onclick = () => {
        if (myRun !== runId) return;
        const v = r.indexOf(0), f = Math.floor(i / 3), cc = i % 3, fv = Math.floor(v / 3), cv = v % 3;
        if (Math.abs(f - fv) + Math.abs(cc - cv) === 1) {
          AudioSys.click(); [r[i], r[v]] = [r[v], r[i]]; d();
          if (r.join('') === '123456780') { AudioSys.win(); fuegosArtificiales(); zetaHabla("¡Rompecabezas armado! Súper inteligencia activada. 🧩"); ganarPremio(); setTimeout(() => { if(myRun === runId) cargarJuego(); }, 5000); }
        }
      }; grid.appendChild(c);
    });
  }; d();
}

function renderArcade(myRun) {
  document.getElementById('btn-audio-repeat').style.display = 'none';
  document.getElementById('juego-pregunta').innerHTML = `Estrellas: <span id="aPts" class="text-yellow-400">0</span> ⭐`;
  const cont = document.getElementById('juego-opciones'); cont.className = 'w-full';
  cont.innerHTML = `<div id="aArea" class="relative w-full h-[600px] bg-black/60 border-8 border-cyan-400 rounded-[60px] overflow-hidden shadow-[inset_0_0_80px_rgba(0,0,0,0.9)] cursor-crosshair"></div>`;
  const area = document.getElementById('aArea'); let pts = 0; zetaHabla("¡Atrapa todas las estrellas, pero no toques los meteoritos de fuego!");
  const spawn = () => {
    if (myRun !== runId || !document.getElementById('aArea')) return;
    const isBad = Math.random() < 0.25; const e = document.createElement('div'); e.textContent = isBad ? '☄️' : '⭐'; 
    e.className = 'absolute text-[100px] transition-transform ' + (isBad ? 'drop-shadow-[0_0_30px_rgba(255,0,0,1)]' : 'drop-shadow-[0_0_30px_rgba(250,204,21,1)] animate-pulse');
    e.style.left = Math.random() * 80 + '%'; e.style.top = '-150px'; area.appendChild(e);
    let pos = -150, speed = isBad ? 8 : 4 + Math.random() * 5;
    const bajar = () => {
      if (myRun !== runId || !e.parentNode) return;
      pos += speed; e.style.top = pos + 'px';
      if (pos > 600) e.remove(); else requestAnimationFrame(bajar);
    };
    e.onmousedown = e.ontouchstart = (ev) => {
      ev.preventDefault(); if (myRun !== runId) return;
      if (isBad) { AudioSys.lose(); e.style.transform = "scale(2.5)"; e.textContent="💥"; setTimeout(()=>e.remove(),200); pts = Math.max(0, pts-2); document.getElementById('aPts').textContent = pts; zetaHabla("¡Ay! Ese meteorito quema."); }
      else { AudioSys.coin(); e.style.transform = "scale(3)"; e.style.opacity = "0"; setTimeout(()=>e.remove(),200); pts++; document.getElementById('aPts').textContent = pts; if (pts % 10 === 0) { ganarPremio(); fuegosArtificiales(); zetaHabla("¡Racha de estrellas! Sigue así."); } }
    };
    requestAnimationFrame(bajar); setTimeout(spawn, 700 + Math.random() * 800);
  }; spawn();
}

function renderPizarra(myRun) {
  document.getElementById('btn-audio-repeat').style.display = 'none';
  document.getElementById('juego-pregunta').innerHTML = `Pizarra Libre`;
  const cont = document.getElementById('juego-opciones'); cont.className = 'w-full';
  cont.innerHTML = `
    <div class="flex gap-6 justify-center mb-8 flex-wrap bg-white/20 p-6 rounded-[50px] max-w-fit mx-auto border-4 border-white/40 backdrop-blur-2xl shadow-2xl">
      ${['#ef4444','#3b82f6','#22c55e','#facc15','#ff007f','#00e5ff','#ffffff'].map(c=>`<button class="w-16 h-16 rounded-full hover:scale-125 transition-transform border-4 border-white" style="background:${c};box-shadow:0 10px 0 rgba(0,0,0,0.3)" onclick="window._ctx.strokeStyle='${c}'"></button>`).join('')}
      <button class="btn-3d btn-pink text-2xl ml-8" onclick="window._ctx.clearRect(0,0,1200,600)">🗑 Borrar</button>
    </div>
    <canvas id="piz" width="1200" height="600" class="bg-black/80 border-8 border-white rounded-[60px] block w-full touch-none shadow-[0_20px_50px_rgba(0,0,0,0.5)] cursor-crosshair"></canvas>
  `;
  const cvs = document.getElementById('piz'); window._ctx = cvs.getContext('2d'); window._ctx.lineWidth = 20; window._ctx.lineCap = 'round'; window._ctx.lineJoin = 'round'; window._ctx.strokeStyle = '#00e5ff'; let p = false;
  zetaHabla("Dibuja una obra de arte espacial. Usa todos los colores.");
  const gp = e => { const r = cvs.getBoundingClientRect(); const scaleX = cvs.width / r.width; const scaleY = cvs.height / r.height; return { x: ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * scaleX, y: ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * scaleY }; };
  cvs.onmousedown = cvs.ontouchstart = e => { e.preventDefault(); p = true; const q = gp(e); window._ctx.beginPath(); window._ctx.moveTo(q.x, q.y); };
  cvs.onmousemove = cvs.ontouchmove = e => { if (!p) return; e.preventDefault(); const q = gp(e); window._ctx.lineTo(q.x, q.y); window._ctx.stroke(); };
  cvs.onmouseup = cvs.ontouchend = cvs.onmouseleave = () => p = false;
}

// ==========================================================================
// INICIALIZACIÓN A PRUEBA DE FALLOS
// ==========================================================================
window.addEventListener('load', () => {
  try {
    cargarPerfil(); renderTabs(); renderMundos();
  } catch(e) { console.error("Error init UI:", e); }
  
  // Garantiza que la pantalla de carga desaparezca aunque haya un fallo menor
  setTimeout(() => {
    const intro = document.getElementById('intro');
    if(intro) {
      intro.style.opacity = '0';
      setTimeout(() => { intro.remove(); zetaSaluda(); }, 1000);
    }
  }, 1500); // Tiempos reducidos para que cargue rapidísimo

  setTimeout(() => {
    const barra = document.getElementById('barraCarga');
    if(barra) barra.style.width = '100%';
  }, 100);
});
</script>
