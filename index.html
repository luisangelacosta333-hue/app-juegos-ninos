<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚀 Woody Planet · English Academy Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* CSS SUPER PREMIUM - DEEP SPACE GLASSMORPHISM */
:root {
  --bg-dark: #050114;
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.5);
  --neon-cyan: #00f0ff;
  --neon-pink: #ff007f;
  --neon-purple: #8a2be2;
}

* { font-family: 'Nunito', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; padding: 0; min-height: 100vh; color: #fff; overflow-x: hidden; scroll-behavior: smooth; }
body { background: var(--bg-dark); }

/* Fondo Dinámico Espacial */
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; }
body::before {
  background: radial-gradient(circle at 20% 40%, rgba(138, 43, 226, 0.15), transparent 60%),
              radial-gradient(circle at 80% 60%, rgba(0, 240, 255, 0.15), transparent 60%);
  animation: cosmicPulse 12s ease-in-out infinite alternate;
}
body::after {
  background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 50px 50px; opacity: 0.2; transform: perspective(500px) rotateX(20deg);
}
@keyframes cosmicPulse { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.05) translate(-10px, 10px); } }

/* Cajas Premium */
.vidrio {
  position: relative; background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 40px; padding: 40px 24px; border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
}
.vidrio-fino {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 24px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.vidrio-fino:hover { transform: translateY(-5px) scale(1.02); background: rgba(255,255,255,0.1); box-shadow: 0 12px 35px rgba(0,240,255,0.15); border-color: rgba(0,240,255,0.3); }

/* Títulos Neón Premium */
.tit-neon {
  font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 1px;
  background: linear-gradient(90deg, #00f0ff, #8a2be2, #ff007f, #fde047, #00f0ff);
  background-size: 300% 100%; -webkit-background-clip: text; color: transparent;
  animation: bgGlow 8s linear infinite; filter: drop-shadow(0 0 20px rgba(138,43,226,0.6));
}
@keyframes bgGlow { to { background-position: 300% } }

/* Botones Master */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 14px 28px; border-radius: 100px;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.15); color: #fff; font-weight: 800; font-size: 1.05rem;
  cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; overflow: hidden;
}
.btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
.btn:hover::before { left: 100%; }
.btn:hover { background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.3); }
.btn:active { transform: scale(0.92) !important; }

/* Botones de Categorías */
.btn.on { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border-color: rgba(255,255,255,0.8); box-shadow: 0 10px 30px rgba(138, 43, 226, 0.6), inset 0 2px 5px rgba(255,255,255,0.4); color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
.tab-btn { padding: 12px 24px; border-radius: 16px; font-size: 0.95rem; font-weight: 800; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); color: #94a3b8; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateY(-2px); }
.tab-btn.active { background: linear-gradient(135deg, #facc15, #f59e0b); color: #451a03; border-color: #fef08a; box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5); }

/* Opciones de Juego - Arreglo de Lógica de Clics */
.pal {
  padding: 28px 24px; border-radius: 28px; font-size: 1.5rem; font-weight: 900;
  cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 2px solid rgba(255,255,255,0.1); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; min-height: 140px; text-align: center; line-height: 1.3;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
.pal .ico { font-size: 4rem; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)); transition: transform 0.3s; }
.pal:hover { transform: translateY(-8px) scale(1.03); border-color: rgba(0,240,255,0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,240,255,0.1); }
.pal:hover .ico { transform: scale(1.1); }
.pal:active { transform: scale(0.95); }

.ok { background: linear-gradient(135deg, #10b981, #059669) !important; border-color: #6ee7b7 !important; color: #fff !important; box-shadow: 0 0 40px rgba(16, 185, 129, 0.8) !important; animation: correctBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important; }
.no { background: linear-gradient(135deg, #ef4444, #b91c1c) !important; border-color: #fca5a5 !important; color: #fff !important; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6) !important; animation: errorShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important; }
@keyframes correctBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-10px); } }
@keyframes errorShake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

/* Botones Especiales */
.btn-oro { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; border: 2px solid #fde68a; box-shadow: 0 8px 25px rgba(217,119,6,0.6); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
.bocina { background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); color: #fff; border: 2px solid #fbcfe8; border-radius: 50%; width: 80px; height: 80px; font-size: 2.5rem; cursor: pointer; box-shadow: 0 10px 30px rgba(255,0,127,0.5); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; justify-content: center; margin: 0 auto; z-index: 10;}
.bocina:hover { transform: scale(1.15) rotate(-15deg); box-shadow: 0 15px 40px rgba(255,0,127,0.7); border-color: #fff; }
.bocina:active { transform: scale(0.9); }

/* Astronauta Animado Flotante Premium */
.prof-container { position: fixed; bottom: 20px; right: 20px; z-index: 55; cursor: pointer; transition: transform 0.3s; }
.prof { font-size: 5rem; filter: drop-shadow(0 10px 15px rgba(0,240,255,0.6)); animation: floatAstronaut 4s ease-in-out infinite; transform-origin: center; }
.prof-container:hover .prof { animation: hyperSpace 0.5s ease-in-out forwards; }
@keyframes floatAstronaut { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-15px) rotate(-5deg); } 75% { transform: translateY(-10px) rotate(5deg); } }
@keyframes hyperSpace { to { transform: scale(1.3) translateY(-30px) rotate(-15deg); filter: drop-shadow(0 20px 30px rgba(255,0,127,0.8)); } }

.globo { position: fixed; bottom: 130px; right: 100px; z-index: 54; max-width: 280px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); color: #0f172a; padding: 20px 24px; border-radius: 30px 30px 4px 30px; font-weight: 800; font-size: 1.1rem; box-shadow: 0 15px 40px rgba(0,0,0,0.6); border: 2px solid rgba(0,240,255,0.5); animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.globo::after { content: ""; position: absolute; bottom: -12px; right: 24px; border: 12px solid transparent; border-top-color: rgba(255,255,255,0.95); }
@keyframes popIn { from { opacity: 0; transform: translateY(20px) scale(0.8); } }

/* Modales y Utilidades */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,1,20,0.85); backdrop-filter: blur(12px); z-index: 99000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px; }
.modal-overlay.activo { opacity: 1; pointer-events: auto; }
.particula { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 99998; animation: confeti 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards; box-shadow: 0 0 10px currentColor; }
@keyframes confeti { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg); opacity: 0; } }

@media (max-width: 640px) {
  .prof-container { right: 10px; bottom: 10px; }
  .prof { font-size: 4rem; }
  .globo { right: 80px; bottom: 100px; font-size: 1rem; max-width: 220px; padding: 15px; }
  .pal { min-height: 100px; padding: 20px 15px; font-size: 1.2rem; }
  .pal .ico { font-size: 3rem; }
}
</style>
</head>
<body>

<div id="intro" class="fixed inset-0 bg-[#050114] z-[100000] flex items-center justify-center flex-col transition-opacity duration-700">
  <div class="text-8xl mb-8 drop-shadow-[0_0_30px_rgba(0,240,255,0.8)] animate-bounce">🚀</div>
  <div class="tit-neon text-4xl md:text-7xl text-center">ENGLISH ACADEMY</div>
  <div class="text-cyan-300 mt-6 font-bold text-xl tracking-widest uppercase">Premium Edition</div>
  <div class="w-72 h-4 bg-white/10 rounded-full mt-12 overflow-hidden border border-white/20"><div class="h-full bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 w-0 transition-all duration-1000" id="barraCarga"></div></div>
</div>

<div class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center gap-4 flex-wrap relative z-10">
  <div class="vidrio-fino p-2 px-5 flex items-center gap-4 cursor-pointer" onclick="mostrarPerfil()">
    <div id="avatarPerfil" class="text-4xl bg-white/10 rounded-full w-14 h-14 flex items-center justify-center border border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.2)]">👦</div>
    <div>
      <div id="nomP" class="font-black text-white text-lg tracking-wide">Student</div>
      <div class="text-sm font-bold text-yellow-400">🪙 <span id="monedasTot">0</span></div>
    </div>
  </div>
  <div class="flex gap-3 flex-wrap">
    <button class="btn border-pink-500/50 hover:border-pink-500 shadow-[0_0_15px_rgba(255,0,127,0.3)]" onclick="verAnuncio()">🎬 +50 Coins</button>
    <button class="btn" onclick="abrirTienda()">🏪 Store</button>
    <button class="btn" onclick="sonido.toggleMusica()" id="btnMus">🔇 Music</button>
  </div>
</div>

<div class="max-w-5xl mx-auto px-4 pt-4 pb-40 relative z-10">
  <div class="flex flex-wrap gap-3 justify-center mb-6 bg-white/5 p-3 rounded-full border border-white/10 backdrop-blur-md" id="cats"></div>
  <div class="flex flex-wrap gap-2 justify-center mb-10" id="tabs"></div>
  <div id="juegos" class="vidrio min-h-[500px]"></div>
</div>

<div class="prof-container" onclick="hablarWoody()">
  <div class="prof" id="prof">👨‍🚀</div>
</div>
<div id="globo" class="globo hidden"></div>
<div id="mascotaFija" class="fixed bottom-6 left-6 z-50 text-6xl hidden drop-shadow-[0_0_20px_rgba(255,255,255,0.6)] animate-bounce"></div>

<!-- Modales -->
<div id="perfilModal" class="modal-overlay"><div class="vidrio max-w-sm w-full p-8 text-center"><h2 class="tit-neon text-4xl mb-8">Profile</h2><input id="nomPerfil" placeholder="Your name" class="w-full p-4 rounded-2xl bg-black/40 border border-white/20 text-white text-center text-2xl mb-8 outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(0,240,255,0.4)] transition-all"><div id="avatares" class="grid grid-cols-6 gap-3 mb-10"></div><button class="btn btn-oro w-full text-2xl py-4" onclick="guardarPerfil()">✅ Save</button></div></div>
<div id="tiendaModal" class="modal-overlay"><div class="vidrio max-w-3xl w-full p-8 max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center mb-8"><h2 class="tit-neon text-4xl">🏪 Store</h2><button class="w-12 h-12 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition-all text-2xl font-black border border-red-500/50" onclick="cerrarModal('tiendaModal')">✕</button></div><div class="text-center mb-10 text-3xl font-black text-yellow-400 bg-yellow-400/10 py-4 rounded-3xl border border-yellow-400/30 shadow-inner">Coins: 🪙 <span id="tiendaMonedas">0</span></div><h3 class="text-2xl font-black text-pink-400 mb-6 tracking-widest uppercase text-center">🐾 Pets</h3><div id="tiendaMascotas" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10"></div><h3 class="text-2xl font-black text-cyan-400 mb-6 tracking-widest uppercase text-center">👑 Gear</h3><div id="tiendaAccesorios" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div></div></div>
<div id="premioModal" class="modal-overlay z-[99999]"><div class="vidrio max-w-sm w-full p-10 text-center"><div id="premioIcono" class="text-9xl mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.8)] animate-bounce">🎁</div><h2 id="premioTexto" class="text-4xl font-black text-yellow-400 mb-10 tracking-wide">YOU WON!</h2><button class="btn btn-oro px-10 py-4 text-2xl w-full" onclick="cerrarModal('premioModal')">Awesome!</button></div></div>

<script>
// Motor de Estado (Previene Bugs de Clics Múltiples)
let runId = 0; 
const sonido = (() => { let ctx; const ini = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }; const tono = (f = 440, d = 0.2, t = 'sine', v = 0.1) => { ini(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d); }; const mel = arr => arr.forEach(([f, d], n) => setTimeout(() => tono(f, d), n * 140)); return { ini, tono, click: () => tono(600, 0.05, 'square', 0.05), ok: () => mel([[523, 0.1], [659, 0.1], [784, 0.15]]), no: () => mel([[300, 0.15], [200, 0.2]]), ganar: () => mel([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.3]]), moneda: () => tono(1200, 0.1, 'sine', 0.05), toggleMusica() { ini(); this._m = !this._m; document.getElementById('btnMus').textContent = this._m ? '🔊 Music' : '🔇 Music'; if (this._m) { const n = [261, 329, 392, 523]; let i = 0; const lp = () => { if (!this._m) return; tono(n[i % 4], 0.2, 'triangle', 0.02); i++; this._t = setTimeout(lp, 600); }; lp(); } else clearTimeout(this._t); } }; })(); document.addEventListener('click', () => sonido.ini(), { once: true });

function hablarIngles(texto) { try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1; const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }

const WOODY = { saludo: ["Hello! Let's learn English! 🚀", "I am Woody, your teacher! 🌍"], ganar: ["Excellent!", "Great job!", "You are a genius! 🌟", "Perfect!"], fallar: ["Almost! Try again.", "Don't give up!", "You can do it!"] };
function hablarWoody(frase) { const texto = frase || rp(WOODY.saludo); const g = document.getElementById('globo'); g.textContent = texto; g.classList.remove('hidden'); clearTimeout(g._t); g._t = setTimeout(() => g.classList.add('hidden'), 4000); hablarIngles(texto); }

let PERFIL = { n: "Student", a: "👦", p: 0, monedas: 100, inv: [], eqMascota: null, eqAcc: null }; let CA = 0, J = 0;
const TIENDA = { mascotas: [ { id: 'm1', ico: '🐉', nom: 'Dragon', p: 500 }, { id: 'm2', ico: '🦄', nom: 'Unicorn', p: 800 }, { id: 'm3', ico: '🤖', nom: 'Robot', p: 1200 }, { id: 'm4', ico: '👽', nom: 'Alien', p: 2000 } ], accesorios: [ { id: 'a1', ico: '👑', nom: 'Crown', p: 300 }, { id: 'a2', ico: '🕶️', nom: 'Glasses', p: 400 }, { id: 'a3', ico: '🎩', nom: 'Hat', p: 500 }, { id: 'a4', ico: '🎓', nom: 'Grad', p: 600 } ] };
function guardarPerfil() { const v = document.getElementById('nomPerfil').value.trim(); if (v) PERFIL.n = v; localStorage.setItem('woodyEnglish', JSON.stringify(PERFIL)); actualizarCabecera(); cerrarModal('perfilModal'); sonido.ok(); } function cargarPerfil() { const s = localStorage.getItem('woodyEnglish'); if (s) PERFIL = { ...PERFIL, ...JSON.parse(s) }; actualizarCabecera(); } function actualizarCabecera() { document.getElementById('nomP').textContent = PERFIL.n; document.getElementById('monedasTot').textContent = PERFIL.monedas; let av = PERFIL.a; if (PERFIL.eqAcc) av += TIENDA.accesorios.find(x => x.id === PERFIL.eqAcc).ico; document.getElementById('avatarPerfil').textContent = av; const m = document.getElementById('mascotaFija'); if (PERFIL.eqMascota) { m.textContent = TIENDA.mascotas.find(x => x.id === PERFIL.eqMascota).ico; m.classList.remove('hidden'); } else m.classList.add('hidden'); } function ganarMonedas(c) { PERFIL.monedas += c; localStorage.setItem('woodyEnglish', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.moneda(); } function mostrarPremio(ico, txt) { document.getElementById('premioIcono').textContent = ico; document.getElementById('premioTexto').textContent = txt; abrirModal('premioModal'); } function abrirModal(id) { document.getElementById(id).classList.add('activo'); sonido.click(); } function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); sonido.click(); } function verAnuncio() { ganarMonedas(50); mostrarPremio('🎬', 'Thanks! +50 Coins'); }
function mostrarPerfil() { document.getElementById('nomPerfil').value = PERFIL.n; const avs = ["👦", "👧", "🧑‍🚀", "👽", "🦊", "🐯"]; document.getElementById('avatares').innerHTML = avs.map(a => `<button class="text-5xl hover:scale-110 transition-transform ${a === PERFIL.a ? 'ring-4 ring-cyan-400 bg-white/20 rounded-3xl' : ''} p-3" onclick="PERFIL.a='${a}';mostrarPerfil()">${a}</button>`).join(''); abrirModal('perfilModal'); }
function abrirTienda() { document.getElementById('tiendaMonedas').textContent = PERFIL.monedas; document.getElementById('tiendaMascotas').innerHTML = TIENDA.mascotas.map(m => { const t = PERFIL.inv.includes(m.id), e = PERFIL.eqMascota === m.id; return `<div class="vidrio-fino p-5 text-center"><div class="text-6xl mb-4">${m.ico}</div><div class="font-bold text-lg mb-4 text-cyan-200">${m.nom}</div>${t ? `<button class="btn w-full text-sm ${e ? '!bg-green-500' : ''}" onclick="equipar('${m.id}','m')">${e ? 'Equipped' : 'Equip'}</button>` : `<button class="btn btn-oro w-full text-sm" onclick="comprar('${m.id}',${m.p})">🪙 ${m.p}</button>`}</div>`; }).join(''); document.getElementById('tiendaAccesorios').innerHTML = TIENDA.accesorios.map(a => { const t = PERFIL.inv.includes(a.id), e = PERFIL.eqAcc === a.id; return `<div class="vidrio-fino p-5 text-center"><div class="text-6xl mb-4">${a.ico}</div><div class="font-bold text-lg mb-4 text-pink-200">${a.nom}</div>${t ? `<button class="btn w-full text-sm ${e ? '!bg-green-500' : ''}" onclick="equipar('${a.id}','a')">${e ? 'Equipped' : 'Equip'}</button>` : `<button class="btn btn-oro w-full text-sm" onclick="comprar('${a.id}',${a.p})">🪙 ${a.p}</button>`}</div>`; }).join(''); abrirModal('tiendaModal'); }
function comprar(id, p) { if (PERFIL.monedas >= p) { PERFIL.monedas -= p; PERFIL.inv.push(id); localStorage.setItem('woodyEnglish', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.ganar(); abrirTienda(); mostrarPremio(id.startsWith('m') ? TIENDA.mascotas.find(x => x.id === id).ico : TIENDA.accesorios.find(x => x.id === id).ico, "Purchased!"); } else { sonido.no(); alert("Not enough coins!"); } } function equipar(id, t) { if (t === 'm') PERFIL.eqMascota = PERFIL.eqMascota === id ? null : id; else PERFIL.eqAcc = PERFIL.eqAcc === id ? null : id; localStorage.setItem('woodyEnglish', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.click(); abrirTienda(); }

// UTILIDADES MATEMÁTICAS CLAVES
const mezclar = a => [...a].sort(() => Math.random() - 0.5); 
const rp = a => a[Math.floor(Math.random() * a.length)]; 
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const conf = (n = 50) => { const cols = ['#00f0ff', '#ff007f', '#8a2be2', '#facc15', '#22c55e']; for (let i = 0; i < n; i++) { const c = document.createElement('div'); c.className = 'particula'; c.style.color = cols[i % cols.length]; c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-20px'; c.style.setProperty('--tx', (Math.random() - 0.5) * 300 + 'px'); c.style.setProperty('--ty', Math.random() * 800 + 'px'); document.body.appendChild(c); setTimeout(() => c.remove(), 1200); } };

// === ESTA ES LA FUNCIÓN QUE ARREGLA TU ERROR DE LÓGICA ===
// Recibe la respuesta correcta y un array de errores.
// Las mezcla todas, y devuelve tanto el array final (opts) como LA POSICIÓN CORRECTA (ok).
function O(correcto, erroneas) { 
  const arr = mezclar([correcto, ...erroneas]); 
  return { opts: arr.map(String), ok: arr.indexOf(String(correcto)) }; 
}

// Motor Principal del Quiz
function quiz({ p, opts, ok, en, ico, es, next }) {
  const gc = document.getElementById('gameContainer');
  gc.innerHTML = `<div class="text-center mb-12 text-3xl md:text-5xl font-black leading-tight tracking-wide drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] text-white">${p}</div><div id="qOps" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto"></div>`;
  const c = document.getElementById('qOps'); const myRun = runId;
  opts.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'pal';
    const icono = ico ? ico[i] : ''; b.innerHTML = (icono ? `<span class="ico">${icono}</span>` : '') + `<span>${o}</span>`;
    b.onclick = () => {
      if (myRun !== runId) return; // Evita clics dobles si cambió de juego
      if (i === ok) { 
        b.classList.add('ok'); sonido.ok(); conf(50); ganarMonedas(5); hablarWoody(rp(WOODY.ganar)); 
        if (en) setTimeout(() => { if (myRun === runId) hablarIngles(en); }, 1000); 
        setTimeout(() => { if (myRun === runId && next) next(); }, 2500); 
      }
      else { 
        b.classList.add('no'); sonido.no(); hablarWoody(rp(WOODY.fallar)); 
      }
    }; c.appendChild(b);
  });
}

const makeGame = (cat, type) => {
  const item = rp(D[cat]);
  const arrErr = mezclar(D[cat].filter(x => x.en !== item.en)).slice(0, 3);
  if (type === 'ES_TO_EN') {
    const r = O(item.en, arrErr.map(x => x.en));
    return { p: `How do you say <span class="text-yellow-400">"${item.es}"</span>?`, opts: r.opts, ok: r.ok, en: item.en };
  } else if (type === 'EN_TO_ES') {
    const r = O(item.es, arrErr.map(x => x.es));
    return { p: `What does <span class="text-cyan-400">"${item.en}"</span> mean?`, opts: r.opts, ok: r.ok, en: item.en };
  } else if (type === 'LISTEN_IMG') {
    const r = O(item, arrErr);
    return { p: `Listen and choose:<br><button class="bocina mt-6" onclick="hablarIngles('${item.en}')">🔊</button>`, opts: r.opts.map(x=>x.en), ico: r.opts.map(x=>x.ico), ok: r.ok, en: item.en };
  } else if (type === 'IMG_TO_EN') {
    const r = O(item.en, arrErr.map(x=>x.en));
    return { p: `What is this?<br><div class="text-8xl mt-4 drop-shadow-[0_0_20px_rgba(255,255,255,0.4)]">${item.ico}</div>`, opts: r.opts, ok: r.ok, en: item.en };
  }
};

  ...Array.from({length:10}, (_,i)=>({c:1, n:`Game ${i+11}`, g:`g${i+11}`})),

function dibCats() {
  document.getElementById('cats').innerHTML = CATS.map((n, i) => `<button class="btn ${i === CA ? 'on' : 'border-white/10'}" data-c="${i}">${n}</button>`).join('');
  document.querySelectorAll('#cats button').forEach(b => b.onclick = () => { sonido.click(); CA = +b.dataset.c; dibTabs(); });
}
function dibTabs() {
  const js = JUEGOS.filter(j => j.c === CA); if(js.length > 0) J = JUEGOS.indexOf(js[0]);
  document.getElementById('tabs').innerHTML = js.map(x => `<button class="tab-btn ${JUEGOS.indexOf(x) === J ? 'active' : ''}" data-j="${JUEGOS.indexOf(x)}">${x.n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { 
    sonido.click(); J = +b.dataset.j; 
    document.querySelectorAll('#tabs button').forEach(tb => tb.classList.remove('active')); 
    b.classList.add('active'); cargarJ(); 
  }); 
  cargarJ();
}
function cargarJ() {
  runId++; 
  const j = JUEGOS[J];
  document.getElementById('juegos').innerHTML = `<h2 class="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 mb-10 text-center tracking-tight drop-shadow-sm uppercase">${j.n}</h2><div id="gameContainer" class="animate-[popIn_0.5s_cubic-bezier(0.34,1.56,0.64,1)]"></div>`;
  const d = GEN[j.g]();
  quiz({ p: d.p, opts: d.opts, ok: d.ok, en: d.en, ico: d.ico, es: d.es, next: cargarJ });
}
