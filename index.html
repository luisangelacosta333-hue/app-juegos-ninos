<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚀 Woody Planet · Aprende Jugando (Gratis)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* CSS SUPER PREMIUM INFANTIL - COLORES VIBRANTES Y 3D */
:root {
  --bg-space: #0b0914;
  --c-cyan: #00e5ff; --c-cyan-s: #009eb3;
  --c-pink: #ff007f; --c-pink-s: #b30059;
  --c-yellow: #ffea00; --c-yellow-s: #b3a400;
  --c-green: #00e676; --c-green-s: #00a152;
  --c-purple: #d500f9; --c-purple-s: #9500ae;
}

* { font-family: 'Nunito', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; padding: 0; min-height: 100vh; color: #fff; overflow-x: hidden; scroll-behavior: smooth; cursor: default; background: var(--bg-space); }

/* Vuelo Infinito (Parallax Estrellas) */
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; }
body::before {
  background: radial-gradient(circle at 50% 50%, rgba(213, 0, 249, 0.15), transparent 70%),
              radial-gradient(circle at 80% 20%, rgba(0, 229, 255, 0.15), transparent 50%);
}
.estrellas { position: fixed; top: -100vh; left: 0; width: 100vw; height: 200vh; background-image: radial-gradient(#fff 2px, transparent 2px), radial-gradient(#fff 1px, transparent 1px); background-size: 80px 80px, 40px 40px; background-position: 0 0, 20px 20px; animation: vueloInfinito 20s linear infinite; z-index: -1; opacity: 0.4; }
@keyframes vueloInfinito { 0% { transform: translateY(0); } 100% { transform: translateY(100vh); } }

/* Títulos Gorditos (Estilo Cartoon) */
.tit-cartoon { font-family: 'Fredoka One', cursive; font-size: clamp(2rem, 6vw, 5rem); color: #fff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 8px 0 var(--c-purple-s), 0 0 20px var(--c-purple); animation: flotar 3s ease-in-out infinite alternate; }

/* Contenedores Gigantes (Ocupan toda la pantalla) */
.caja-gigante { width: 95vw; max-width: 1600px; margin: 0 auto; }
.vidrio { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 50px; padding: 50px 30px; border: 6px solid rgba(255,255,255,0.2); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }

/* BOTONES FLOTANTES DE COLORES 3D (Burbujas) */
.btn-3d {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  padding: 15px 35px; border-radius: 100px; font-family: 'Fredoka One', cursive; font-size: 1.5rem;
  color: #fff; cursor: pointer; user-select: none; transition: all 0.15s; border: 4px solid rgba(255,255,255,0.4);
  animation: flotarBtn 4s ease-in-out infinite; text-transform: uppercase; letter-spacing: 1px;
}
@keyframes flotarBtn { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.btn-cyan { background: var(--c-cyan); box-shadow: 0 10px 0 var(--c-cyan-s), 0 15px 20px rgba(0,0,0,0.4); text-shadow: 0 3px 0 var(--c-cyan-s); }
.btn-cyan:active { transform: translateY(10px) !important; box-shadow: 0 0 0 var(--c-cyan-s), 0 5px 10px rgba(0,0,0,0.4); }

.btn-pink { background: var(--c-pink); box-shadow: 0 10px 0 var(--c-pink-s), 0 15px 20px rgba(0,0,0,0.4); text-shadow: 0 3px 0 var(--c-pink-s); animation-delay: 0.5s; }
.btn-pink:active { transform: translateY(10px) !important; box-shadow: 0 0 0 var(--c-pink-s), 0 5px 10px rgba(0,0,0,0.4); }

.btn-yellow { background: var(--c-yellow); color: #5a4200; box-shadow: 0 10px 0 var(--c-yellow-s), 0 15px 20px rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(255,255,255,0.5); animation-delay: 1s; }
.btn-yellow:active { transform: translateY(10px) !important; box-shadow: 0 0 0 var(--c-yellow-s), 0 5px 10px rgba(0,0,0,0.4); }

/* Opciones de Juego - Cajas de Colores Mágicas */
.pal {
  padding: 40px 20px; border-radius: 40px; font-size: 2.8rem; font-weight: 900; font-family: 'Fredoka One', cursive;
  cursor: pointer; user-select: none; transition: all 0.15s; background: rgba(255,255,255,0.15);
  border: 6px solid #fff; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; min-height: 220px; text-align: center; line-height: 1.2;
  box-shadow: 0 15px 0 rgba(0,0,0,0.3), 0 20px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden;
}
.pal::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%); opacity: 0; transition: 0.3s; }
.pal:hover::before { opacity: 1; transform: scale(1.2); }
.pal .ico { font-size: 7rem; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4)); transition: transform 0.2s; }
.pal:hover { transform: translateY(-5px); background: rgba(255,255,255,0.25); border-color: var(--c-yellow); }
.pal:hover .ico { transform: scale(1.15) rotate(5deg); }
.pal:active { transform: translateY(15px); box-shadow: 0 0 0 rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.5); }

/* Feedback Educativo Animado */
.ok { background: var(--c-green) !important; border-color: #fff !important; box-shadow: 0 15px 0 var(--c-green-s), 0 0 50px var(--c-green) !important; animation: winPop 0.6s !important; }
.no { background: var(--c-pink) !important; border-color: #fff !important; box-shadow: 0 15px 0 var(--c-pink-s), 0 0 50px var(--c-pink) !important; animation: errorShake 0.5s !important; }
@keyframes winPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-20px) rotate(5deg); } }
@keyframes errorShake { 10%, 90% { transform: translateX(-5px); } 20%, 80% { transform: translateX(10px); } 30%, 50%, 70% { transform: translateX(-20px); } 40%, 60% { transform: translateX(20px); } }

/* Botón Altavoz (Para Inglés) */
.bocina { background: var(--c-purple); color: #fff; border: 6px solid #fff; border-radius: 50%; width: 120px; height: 120px; font-size: 5rem; cursor: pointer; box-shadow: 0 12px 0 var(--c-purple-s); transition: all 0.15s; display: flex; align-items: center; justify-content: center; margin: 0 auto; z-index: 10; animation: flotar 3s infinite alternate; }
.bocina:hover { transform: scale(1.1); }
.bocina:active { transform: translateY(12px); box-shadow: 0 0 0 var(--c-purple-s); }

/* Profe Astronauta (Woody) */
.prof-container { position: fixed; bottom: 40px; right: 40px; z-index: 55; cursor: pointer; }
.prof { font-size: 10rem; filter: drop-shadow(0 20px 30px rgba(0,229,255,0.6)); animation: floatAstronaut 6s ease-in-out infinite; transform-origin: center; }
.prof-container:hover .prof { animation: hyperSpace 0.5s forwards; }
@keyframes floatAstronaut { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-30px) rotate(5deg); } }
@keyframes hyperSpace { to { transform: scale(1.4) translateY(-60px) rotate(-15deg); filter: drop-shadow(0 40px 50px rgba(255,0,127,1)); } }

/* Globo de Texto GIGANTE y AMIGABLE */
.globo { position: fixed; bottom: 250px; right: 180px; z-index: 54; max-width: 500px; background: #fff; color: #1e1b4b; padding: 35px 45px; border-radius: 50px 50px 10px 50px; font-weight: 900; font-size: 2.2rem; line-height: 1.3; font-family: 'Fredoka One', cursive; box-shadow: 0 30px 60px rgba(0,0,0,0.6); border: 8px solid var(--c-cyan); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.globo::after { content: ""; position: absolute; bottom: -28px; right: 50px; border: 28px solid transparent; border-top-color: var(--c-cyan); }
.globo::before { content: ""; position: absolute; bottom: -18px; right: 56px; border: 18px solid transparent; border-top-color: #fff; z-index: 1; }
@keyframes popIn { from { opacity: 0; transform: translateY(50px) scale(0.5) rotate(10deg); } }

/* Fuegos Artificiales (Partículas) */
.fw-particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 99999; box-shadow: 0 0 20px currentColor; animation: fwAnim 1.2s ease-out forwards; }
@keyframes fwAnim { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

/* Modales */
.modal-overlay { position: fixed; inset: 0; background: rgba(11,9,20,0.95); backdrop-filter: blur(25px); z-index: 99000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px; }
.modal-overlay.activo { opacity: 1; pointer-events: auto; }

/* Pestañas / Categorías */
.tabs-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 40px; }
.tab-btn { padding: 20px 40px; border-radius: 30px; font-family: 'Fredoka One', cursive; font-size: 1.5rem; background: rgba(0,0,0,0.5); border: 4px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 0 rgba(0,0,0,0.4); }
.tab-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-5px); box-shadow: 0 13px 0 rgba(0,0,0,0.4); }
.tab-btn:active { transform: translateY(8px); box-shadow: 0 0 0 rgba(0,0,0,0.4); }
.tab-btn.active { background: var(--c-yellow); color: #5a4200; border-color: #fff; box-shadow: 0 8px 0 var(--c-yellow-s); }

@media (max-width: 768px) {
  .prof { font-size: 7rem; } .globo { right: 50px; bottom: 180px; font-size: 1.5rem; max-width: 300px; padding: 25px; }
  .pal { font-size: 1.8rem; min-height: 150px; padding: 20px; border-width: 4px; } .pal .ico { font-size: 5rem; }
  .btn-3d { font-size: 1.2rem; padding: 12px 25px; } .tit-cartoon { font-size: 2.5rem; }
  .vidrio { padding: 30px 15px; border-radius: 30px; }
}
</style>
</head>
<body>

<div class="estrellas"></div>

<!-- INTRO MAGICO -->
<div id="intro" class="fixed inset-0 bg-[#0b0914] z-[100000] flex items-center justify-center flex-col transition-opacity duration-1000">
  <div class="text-[150px] mb-10 drop-shadow-[0_0_60px_rgba(0,229,255,1)] animate-bounce">🚀</div>
  <div class="tit-cartoon text-center">WOODY PLANET</div>
  <div class="text-yellow-300 mt-8 font-black text-4xl tracking-widest uppercase drop-shadow-lg font-['Fredoka_One']">Educación Premium Gratis</div>
  <div class="w-[500px] max-w-[90vw] h-8 bg-white/20 rounded-full mt-16 border-4 border-white/40 p-1"><div class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 w-0 transition-all duration-1000 shadow-[0_0_20px_rgba(255,0,127,1)]" id="barraCarga"></div></div>
</div>

<!-- CABECERA GIGANTE -->
<div class="caja-gigante px-4 py-8 flex justify-between items-center gap-6 flex-wrap relative z-10">
  <div class="bg-white/10 backdrop-blur-md p-4 px-8 rounded-full border-4 border-white/30 flex items-center gap-6 cursor-pointer shadow-xl hover:bg-white/20 transition-all" onclick="mostrarPerfil()">
    <div id="avatarPerfil" class="text-7xl bg-white/20 rounded-full w-24 h-24 flex items-center justify-center border-4 border-white/50 shadow-[0_0_25px_rgba(255,255,255,0.5)]">👦</div>
    <div>
      <div id="nomP" class="font-black text-white text-3xl font-['Fredoka_One'] tracking-wide">Amigo</div>
      <div class="text-2xl font-black text-yellow-400 drop-shadow-md mt-1">🪙 <span id="monedasTot">0</span></div>
    </div>
  </div>
  <div class="flex gap-6 flex-wrap">
    <button class="btn-3d btn-pink" onclick="verAnuncio()">🎬 +50 Monedas</button>
    <button class="btn-3d btn-cyan" onclick="abrirTienda()">🏪 Tienda</button>
    <button class="btn-3d btn-purple" onclick="sonido.toggleMusica()" id="btnMus" style="background:var(--c-purple);box-shadow:0 10px 0 var(--c-purple-s)">🔇 Música</button>
  </div>
</div>

<!-- CONTENEDOR PRINCIPAL JUEGOS (ANCHO COMPLETO) -->
<div class="caja-gigante px-4 pt-8 pb-56 relative z-10">
  <div class="tabs-container bg-black/40 p-6 rounded-[40px] border-4 border-white/20 backdrop-blur-xl shadow-2xl" id="cats"></div>
  <div class="tabs-container mb-16" id="tabs"></div>
  <div id="juegos" class="vidrio min-h-[700px]"></div>
</div>

<!-- PROFE WOODY -->
<div class="prof-container" onclick="hablarWoody('¡Acá estoy para ayudarte! Toca cualquier juego para empezar.')">
  <div class="prof" id="prof">👨‍🚀</div>
</div>
<div id="globo" class="globo hidden"></div>

<!-- MODALES PREMIUM -->
<div id="perfilModal" class="modal-overlay"><div class="vidrio max-w-2xl w-full p-16 text-center"><h2 class="tit-cartoon mb-12">Tu Perfil</h2><input id="nomPerfil" placeholder="Tu nombre" class="w-full p-8 rounded-[40px] bg-black/50 border-8 border-white/30 text-white text-center text-5xl mb-12 outline-none focus:border-cyan-400 focus:shadow-[0_0_40px_rgba(0,229,255,0.6)] transition-all font-['Fredoka_One']"><div id="avatares" class="grid grid-cols-3 gap-8 mb-14"></div><button class="btn-3d btn-green w-full text-5xl py-8" style="background:var(--c-green);box-shadow:0 12px 0 var(--c-green-s)" onclick="guardarPerfil()">✅ Guardar</button></div></div>
<div id="tiendaModal" class="modal-overlay"><div class="vidrio max-w-6xl w-full p-14 max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center mb-14"><h2 class="tit-cartoon">🏪 Tienda Mágica</h2><button class="w-20 h-20 rounded-full bg-red-500 text-white hover:bg-red-400 transition-all text-5xl font-black border-8 border-red-700 flex items-center justify-center shadow-[0_8px_0_#991b1b] active:translate-y-2 active:shadow-none" onclick="cerrarModal('tiendaModal')">✕</button></div><div class="text-center mb-16 text-6xl font-black text-yellow-400 bg-yellow-400/20 py-8 rounded-[50px] border-8 border-yellow-400/50 shadow-inner font-['Fredoka_One']">Tus Monedas: 🪙 <span id="tiendaMonedas">0</span></div><div id="tiendaMascotas" class="grid grid-cols-2 md:grid-cols-4 gap-10 mb-16"></div><div id="tiendaAccesorios" class="grid grid-cols-2 md:grid-cols-4 gap-10"></div></div></div>
<div id="premioModal" class="modal-overlay z-[99999]"><div class="vidrio max-w-2xl w-full p-20 text-center"><div id="premioIcono" class="text-[200px] mb-12 drop-shadow-[0_0_60px_rgba(255,255,255,1)] animate-bounce">🎁</div><h2 id="premioTexto" class="tit-cartoon text-yellow-400 mb-16 drop-shadow-xl">¡GANASTE!</h2><button class="btn-3d btn-yellow w-full text-5xl py-8" onclick="cerrarModal('premioModal')">¡Súper!</button></div></div>

<script>
// ==========================================
// CORE: AUDIO, FUEGOS ARTIFICIALES Y VOZ
// ==========================================
let runId = 0; 
const sonido = (() => { let ctx; const ini = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }; const tono = (f = 440, d = 0.2, t = 'sine', v = 0.1) => { ini(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d); }; const mel = arr => arr.forEach(([f, d], n) => setTimeout(() => tono(f, d), n * 140)); return { ini, tono, click: () => tono(600, 0.05, 'square', 0.05), ok: () => mel([[523, 0.1], [659, 0.1], [784, 0.15]]), no: () => mel([[300, 0.15], [200, 0.2]]), ganar: () => mel([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.3]]), moneda: () => tono(1200, 0.1, 'sine', 0.05), toggleMusica() { ini(); this._m = !this._m; document.getElementById('btnMus').textContent = this._m ? '🔊 Música' : '🔇 Música'; if (this._m) { const n = [261, 329, 392, 523]; let i = 0; const lp = () => { if (!this._m) return; tono(n[i % 4], 0.2, 'triangle', 0.02); i++; this._t = setTimeout(lp, 600); }; lp(); } else clearTimeout(this._t); } }; })(); 

// Fuegos Artificiales 
function fuegosArtificiales(x, y) {
  const colors = ['#00e5ff', '#ff007f', '#ffea00', '#00e676', '#d500f9'];
  const centerX = x || window.innerWidth / 2; const centerY = y || window.innerHeight / 2;
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div'); p.className = 'fw-particle';
    const size = Math.random() * 20 + 10; p.style.width = size + 'px'; p.style.height = size + 'px';
    p.style.color = colors[Math.floor(Math.random() * colors.length)]; p.style.background = p.style.color;
    p.style.left = centerX + 'px'; p.style.top = centerY + 'px';
    const angle = Math.random() * Math.PI * 2; const velocity = Math.random() * 400 + 100;
    p.style.setProperty('--tx', Math.cos(angle) * velocity + 'px');
    p.style.setProperty('--ty', (Math.sin(angle) * velocity + 200) + 'px'); // Gravedad
    document.body.appendChild(p); setTimeout(() => p.remove(), 1200);
  }
}

document.addEventListener('click', (e) => { sonido.ini(); });

// Profesor Woody: Voz y Enseñanza
function hablarIngles(texto) { try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1; const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }

function hablarWoody(texto, esIngles = false) { 
  const g = document.getElementById('globo'); g.textContent = texto; g.classList.remove('hidden'); 
  clearTimeout(g._t); g._t = setTimeout(() => g.classList.add('hidden'), 5000); 
  try { 
    if ('speechSynthesis' in window) { 
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); 
      if(esIngles) { u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1; const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en')); if (v) u.voice = v; } 
      else { u.lang = 'es-AR'; u.pitch = 1.3; u.rate = 0.95; }
      speechSynthesis.speak(u); 
    } 
  } catch (e) {} 
}

// Perfil y Tienda
let PERFIL = { n: "Amigo", a: "👦", p: 0, monedas: 100, inv: [], eqMascota: null, eqAcc: null }; let CA = 0, J = 0;
const TIENDA = { mascotas: [ { id: 'm1', ico: '🐉', nom: 'Dragón', p: 500 }, { id: 'm2', ico: '🦄', nom: 'Unicornio', p: 800 }, { id: 'm3', ico: '🤖', nom: 'Robot', p: 1200 }, { id: 'm4', ico: '👽', nom: 'Marciano', p: 2000 } ], accesorios: [ { id: 'a1', ico: '👑', nom: 'Corona', p: 300 }, { id: 'a2', ico: '🕶️', nom: 'Gafas', p: 400 }, { id: 'a3', ico: '🎩', nom: 'Galera', p: 500 }, { id: 'a4', ico: '🎓', nom: 'Graduado', p: 600 } ] };
function guardarPerfil() { const v = document.getElementById('nomPerfil').value.trim(); if (v) PERFIL.n = v; localStorage.setItem('woodyKids', JSON.stringify(PERFIL)); actualizarCabecera(); cerrarModal('perfilModal'); sonido.ok(); } function cargarPerfil() { const s = localStorage.getItem('woodyKids'); if (s) PERFIL = { ...PERFIL, ...JSON.parse(s) }; actualizarCabecera(); } function actualizarCabecera() { document.getElementById('nomP').textContent = PERFIL.n; document.getElementById('monedasTot').textContent = PERFIL.monedas; document.getElementById('avatarPerfil').textContent = PERFIL.a; } function ganarMonedas(c) { PERFIL.monedas += c; localStorage.setItem('woodyKids', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.moneda(); } function mostrarPremio(ico, txt) { document.getElementById('premioIcono').textContent = ico; document.getElementById('premioTexto').textContent = txt; abrirModal('premioModal'); } function abrirModal(id) { document.getElementById(id).classList.add('activo'); sonido.click(); } function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); sonido.click(); } function verAnuncio() { ganarMonedas(50); mostrarPremio('🎬', '¡Genial! +50 Monedas'); }
function mostrarPerfil() { document.getElementById('nomPerfil').value = PERFIL.n; const avs = ["👦", "👧", "🧑‍🚀", "👽", "🦊", "🐯"]; document.getElementById('avatares').innerHTML = avs.map(a => `<button class="text-[100px] hover:scale-110 transition-transform ${a === PERFIL.a ? 'ring-8 ring-cyan-400 bg-white/20 rounded-[50px]' : ''} p-6" onclick="PERFIL.a='${a}';mostrarPerfil()">${a}</button>`).join(''); abrirModal('perfilModal'); }
function abrirTienda() { document.getElementById('tiendaMonedas').textContent = PERFIL.monedas; document.getElementById('tiendaMascotas').innerHTML = TIENDA.mascotas.map(m => `<div class="bg-white/10 p-8 rounded-[40px] border-4 border-white/20 text-center"><div class="text-[100px] mb-6">${m.ico}</div><div class="font-['Fredoka_One'] text-3xl text-cyan-300 mb-6">${m.nom}</div><button class="btn-3d btn-yellow w-full text-3xl" onclick="comprar('${m.id}',${m.p})">🪙 ${m.p}</button></div>`).join(''); document.getElementById('tiendaAccesorios').innerHTML = TIENDA.accesorios.map(a => `<div class="bg-white/10 p-8 rounded-[40px] border-4 border-white/20 text-center"><div class="text-[100px] mb-6">${a.ico}</div><div class="font-['Fredoka_One'] text-3xl text-pink-300 mb-6">${a.nom}</div><button class="btn-3d btn-yellow w-full text-3xl" onclick="comprar('${a.id}',${a.p})">🪙 ${a.p}</button></div>`).join(''); abrirModal('tiendaModal'); }
function comprar(id, p) { if (PERFIL.monedas >= p) { PERFIL.monedas -= p; PERFIL.inv.push(id); localStorage.setItem('woodyKids', JSON.stringify(PERFIL)); actualizarCabecera(); sonido.ganar(); abrirTienda(); mostrarPremio('🛍️', "¡Comprado!"); } else { sonido.no(); hablarWoody("¡Necesitas más monedas! Vamos a jugar para ganar más."); } }

// Utilidades Lógicas
const mezclar = a => [...a].sort(() => Math.random() - 0.5); 
const rp = a => a[Math.floor(Math.random() * a.length)]; 
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
function O(correcto, erroneas) { const arr = mezclar([correcto, ...erroneas]); return { opts: arr.map(String), ok: arr.indexOf(String(correcto)) }; }

// ==========================================
// EL MOTOR DE APRENDIZAJE EMPÁTICO
// ==========================================
function quiz({ p, opts, ok, en, ico, pregunta, respuesta, next }) {
  const gc = document.getElementById('gameContainer');
  gc.innerHTML = `<div class="text-center mb-16 text-6xl md:text-8xl font-black font-['Fredoka_One'] leading-tight tracking-wide text-white drop-shadow-[0_10px_0_rgba(0,0,0,0.5)]">${p}</div><div id="qOps" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 w-full mx-auto"></div>`;
  const c = document.getElementById('qOps'); const myRun = runId;
  opts.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'pal';
    const icono = ico ? ico[i] : ''; b.innerHTML = (icono ? `<span class="ico">${icono}</span>` : '') + `<span>${o}</span>`;
    b.onclick = () => {
      if (myRun !== runId) return; 
      if (i === ok) { 
        b.classList.add('ok'); sonido.ok(); fuegosArtificiales(); ganarMonedas(5); 
        hablarWoody(rp(["¡Bien! ¡Lo lograste!", "¡Excelente, eres genial!", "¡Perfecto! Sigue así."])); 
        if (en) setTimeout(() => { if (myRun === runId) hablarIngles(en); }, 1500); 
        setTimeout(() => { if (myRun === runId && next) next(); }, 4000); 
      }
      else { 
        b.classList.add('no'); sonido.no(); 
        // CORRECCIÓN EMPÁTICA Y EDUCATIVA
        hablarWoody(`No, vamos, que tú puedes. Yo te ayudo. ${pregunta} es ${respuesta}.`); 
      }
    }; c.appendChild(b);
  });
  if(pregunta) setTimeout(() => hablarWoody(pregunta), 800);
}
// ==========================================
// JUEGOS INTERACTIVOS INFANTILES (A PANTALLA COMPLETA)
// ==========================================

function jMemoria() {
  const gc = document.getElementById('gameContainer');
  gc.innerHTML = `<div class="text-center mb-14 font-black text-6xl text-cyan-300 font-['Fredoka_One'] drop-shadow-[0_5px_0_rgba(0,0,0,0.5)]">Aciertos: <span id="mPts" class="text-white">0</span> / 6</div><div id="mGrilla" class="grid grid-cols-3 lg:grid-cols-4 gap-8 w-full max-w-[1200px] mx-auto"></div><div class="text-center mt-20"><button class="btn-3d btn-yellow text-4xl" onclick="cargarJ()">🔄 Reiniciar Juego</button></div>`;
  const emojis = ["🚀", "🐶", "🌍", "🍕", "🛸", "👾"]; const arr = mezclar([...emojis, ...emojis]);
  const gr = document.getElementById('mGrilla'); let sel = [], pts = 0; const myRun = runId;
  
  hablarWoody("Encuentra las cartas que son iguales. ¡Concéntrate!");
  
  arr.forEach((ico) => {
    const c = document.createElement('div'); c.className = 'carta relative aspect-square cursor-pointer';
    c.innerHTML = `<div class="absolute inset-0 bg-gradient-to-br from-purple-600 to-indigo-900 border-8 border-cyan-400 rounded-[40px] shadow-[0_15px_0_rgba(0,229,255,0.4)] flex items-center justify-center text-7xl transition-all duration-300 transform preserve-3d" id="inner-${Math.random()}"><span class="opacity-50 text-white font-black">?</span></div>`;
    
    let isFlipped = false;
    c.onclick = () => {
      if (myRun !== runId || sel.length >= 2 || isFlipped) return;
      isFlipped = true; sonido.click(); 
      c.firstChild.innerHTML = `<span class="text-[100px] drop-shadow-lg">${ico}</span>`;
      c.firstChild.className = "absolute inset-0 bg-yellow-400 border-8 border-white rounded-[40px] shadow-[0_15px_0_rgba(255,255,255,0.4)] flex items-center justify-center transition-all duration-300 transform scale-105";
      sel.push({ c, ico, setFlip: (val) => isFlipped = val });
      
      if (sel.length === 2) {
        if (sel[0].ico === sel[1].ico) {
          sonido.ok(); pts++; document.getElementById('mPts').textContent = pts; sel = []; ganarMonedas(3);
          hablarWoody("¡Súper! Encontraste una pareja.");
          if (pts === 6) { sonido.ganar(); fuegosArtificiales(); fuegosArtificiales(window.innerWidth/3, window.innerHeight/3); hablarWoody("¡Memoria perfecta, astronauta! Eres brillante. 🏆"); setTimeout(() => { if(myRun === runId) cargarJ(); }, 6000); }
        } else { 
          sonido.no(); hablarWoody("Ups, esas no son iguales.");
          setTimeout(() => { 
            if (myRun === runId) { 
              sel.forEach(s => { 
                s.setFlip(false); 
                s.c.firstChild.innerHTML = `<span class="opacity-50 text-white font-black">?</span>`;
                s.c.firstChild.className = "absolute inset-0 bg-gradient-to-br from-purple-600 to-indigo-900 border-8 border-cyan-400 rounded-[40px] shadow-[0_15px_0_rgba(0,229,255,0.4)] flex items-center justify-center text-7xl transition-all duration-300 transform";
              }); sel = []; 
            } 
          }, 1500); 
        }
      }
    }; gr.appendChild(c);
  });
}

function jRompe() {
  const gc = document.getElementById('gameContainer');
  gc.innerHTML = `<div id="rGrilla" class="grid grid-cols-3 gap-4 w-full max-w-[700px] mx-auto bg-white/10 p-8 rounded-[50px] border-8 border-white/30 shadow-[0_30px_60px_rgba(0,0,0,0.6)]"></div><div class="text-center mt-16"><button class="btn-3d btn-pink text-4xl" onclick="cargarJ()">🔄 Mezclar</button></div>`;
  let r = [1, 2, 3, 4, 5, 6, 7, 8, 0];
  for (let i = 0; i < 150; i++) {
    let v = r.indexOf(0), vv = [];
    if (v % 3) vv.push(v - 1); if (v % 3 !== 2) vv.push(v + 1); if (v >= 3) vv.push(v - 3); if (v < 6) vv.push(v + 3);
    let a = vv[ri(0, vv.length - 1)]; [r[v], r[a]] = [r[a], r[v]];
  }
  const myRun = runId;
  
  hablarWoody("Ordena las figuras moviendo las piezas hacia el hueco vacío.");
  
  const d = () => {
    if (myRun !== runId) return;
    const g = document.getElementById('rGrilla'); g.innerHTML = '';
    r.forEach((n, i) => {
      const c = document.createElement('div');
      c.className = 'aspect-square rounded-[30px] flex items-center justify-center text-[100px] font-black cursor-pointer transition-all duration-200 ' + (n ? 'bg-gradient-to-br from-cyan-400 to-blue-600 border-8 border-white shadow-[0_15px_0_rgba(0,0,0,0.3)] hover:scale-105 hover:z-10' : 'bg-black/40 border-8 border-dashed border-white/30');
      c.textContent = n ? ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼"][n-1] : '';
      if (n) c.onclick = () => {
        if (myRun !== runId) return;
        const v = r.indexOf(0), f = Math.floor(i / 3), cc = i % 3, fv = Math.floor(v / 3), cv = v % 3;
        if (Math.abs(f - fv) + Math.abs(cc - cv) === 1) {
          sonido.click(); [r[i], r[v]] = [r[v], r[i]]; d();
          if (r.join('') === '123456780') { sonido.ganar(); fuegosArtificiales(); hablarWoody("¡Rompecabezas armado! Súper inteligencia activada. 🧩"); ganarMonedas(15); setTimeout(() => { if(myRun === runId) cargarJ(); }, 5000); }
        }
      }; g.appendChild(c);
    });
  }; d();
}

function jArcade() {
  const gc = document.getElementById('gameContainer'); const myRun = runId;
  gc.innerHTML = `<div class="text-center font-black text-6xl mb-10 font-['Fredoka_One'] text-yellow-400 drop-shadow-[0_5px_0_rgba(0,0,0,0.5)]">Estrellas: <span id="aPts" class="text-white">0</span> ⭐</div><div id="aArea" class="relative w-full h-[600px] bg-black/60 border-8 border-cyan-400 rounded-[60px] overflow-hidden shadow-[inset_0_0_80px_rgba(0,0,0,0.9)] cursor-crosshair"></div>`;
  const area = document.getElementById('aArea'); let pts = 0;
  
  hablarWoody("¡Toca las estrellas fugaces, pero no toques los meteoritos de fuego!");

  const spawn = () => {
    if (myRun !== runId || !document.getElementById('aArea')) return;
    const isBad = Math.random() < 0.25; 
    const e = document.createElement('div'); 
    e.textContent = isBad ? '☄️' : '⭐'; 
    e.className = 'absolute text-[120px] transition-transform ' + (isBad ? 'drop-shadow-[0_0_30px_rgba(255,0,0,1)]' : 'drop-shadow-[0_0_30px_rgba(250,204,21,1)] animate-pulse');
    e.style.left = Math.random() * 80 + '%'; e.style.top = '-150px'; area.appendChild(e);
    let pos = -150, speed = isBad ? 7 : 4 + Math.random() * 4;
    const bajar = () => {
      if (myRun !== runId || !e.parentNode) return;
      pos += speed; e.style.top = pos + 'px';
      if (pos > 600) e.remove(); else requestAnimationFrame(bajar);
    };
    e.onmousedown = e.ontouchstart = (ev) => {
      ev.preventDefault(); if (myRun !== runId) return;
      if (isBad) { sonido.no(); e.style.transform = "scale(2.5)"; e.textContent="💥"; setTimeout(()=>e.remove(),200); pts = Math.max(0, pts-2); document.getElementById('aPts').textContent = pts; hablarWoody("¡Ay! Ese meteorito quema."); }
      else { sonido.moneda(); e.style.transform = "scale(3)"; e.style.opacity = "0"; setTimeout(()=>e.remove(),200); pts++; document.getElementById('aPts').textContent = pts; if (pts % 10 === 0) { ganarMonedas(10); fuegosArtificiales(); hablarWoody("¡Racha de estrellas! Sigue así."); } }
    };
    requestAnimationFrame(bajar);
    setTimeout(spawn, 700 + Math.random() * 800);
  }; spawn();
}

function jPizarra() {
  const gc = document.getElementById('gameContainer');
  gc.innerHTML = `<div class="flex gap-6 justify-center mb-12 flex-wrap bg-white/20 p-6 rounded-[50px] max-w-fit mx-auto border-4 border-white/40 backdrop-blur-2xl shadow-2xl">
    ${['#ef4444','#3b82f6','#22c55e','#facc15','#ff007f','#00e5ff','#ffffff'].map(c=>`<button class="w-20 h-20 rounded-full hover:scale-125 transition-transform border-4 border-white" style="background:${c};box-shadow:0 10px 0 rgba(0,0,0,0.3)" onclick="window._ctx.strokeStyle='${c}'"></button>`).join('')}
    <button class="btn-3d btn-pink text-3xl ml-10" onclick="window._ctx.clearRect(0,0,1400,700)">🗑 Borrar</button>
  </div><canvas id="piz" width="1400" height="700" class="bg-black/80 border-8 border-white rounded-[60px] block w-full touch-none shadow-[0_20px_50px_rgba(0,0,0,0.5)] cursor-crosshair"></canvas>`;
  const cvs = document.getElementById('piz'); window._ctx = cvs.getContext('2d');
  window._ctx.lineWidth = 20; window._ctx.lineCap = 'round'; window._ctx.lineJoin = 'round'; window._ctx.strokeStyle = '#00e5ff'; let p = false;
  
  hablarWoody("Dibuja una obra de arte espacial.");
  
  const gp = e => { const r = cvs.getBoundingClientRect(); const scaleX = cvs.width / r.width; const scaleY = cvs.height / r.height; return { x: ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * scaleX, y: ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * scaleY }; };
  cvs.onmousedown = cvs.ontouchstart = e => { e.preventDefault(); p = true; const q = gp(e); window._ctx.beginPath(); window._ctx.moveTo(q.x, q.y); };
  cvs.onmousemove = cvs.ontouchmove = e => { if (!p) return; e.preventDefault(); const q = gp(e); window._ctx.lineTo(q.x, q.y); window._ctx.stroke(); };
  cvs.onmouseup = cvs.ontouchend = cvs.onmouseleave = () => p = false;
}

// ==========================================
// PREGUNTAS: MATEMÁTICAS, INGLÉS Y LÓGICA
// ==========================================
const D = {
  animals: [{en:"Dog",es:"Perro",ico:"🐶"},{en:"Cat",es:"Gato",ico:"🐱"},{en:"Bird",es:"Pájaro",ico:"🐦"},{en:"Fish",es:"Pez",ico:"🐟"},{en:"Pig",es:"Cerdo",ico:"🐷"}],
  colors: [{en:"Red",es:"Rojo",c:"#ef4444"},{en:"Blue",es:"Azul",c:"#3b82f6"},{en:"Green",es:"Verde",c:"#22c55e"},{en:"Yellow",es:"Amarillo",c:"#facc15"}]
};

const GEN = {};

// MATEMÁTICAS (CORRECCIÓN INTELIGENTE)
GEN.g1 = () => { 
  const a=ri(1,5), b=ri(1,5); 
  return { p: `¿Cuánto es <span class="text-yellow-400">${a} + ${b}</span>?`, opts: O(a+b, [a+b+1, a+b-1, a+b+2]).opts, ok: O(a+b, [a+b+1, a+b-1, a+b+2]).ok, pregunta: `¿Cuánto es ${a} más ${b}?`, respuesta: `${a+b}` }; 
};
GEN.g2 = () => { 
  const a=ri(5,10), b=ri(1,4); 
  return { p: `¿Cuánto es <span class="text-pink-400">${a} - ${b}</span>?`, opts: O(a-b, [a-b+1, a-b-1, a-b+2]).opts, ok: O(a-b, [a-b+1, a-b-1, a-b+2]).ok, pregunta: `¿Cuánto es ${a} menos ${b}?`, respuesta: `${a-b}` }; 
};

// INGLÉS
GEN.g10= () => { 
  const item = rp(D.animals); const arrErr = mezclar(D.animals.filter(x => x.en !== item.en)).slice(0, 3); const r = O(item.en, arrErr.map(x=>x.en));
  return { p: `¿Cómo se dice <span class="text-yellow-400">"${item.es}"</span> en Inglés?<br><div class="text-[150px] mt-10 drop-shadow-[0_20px_0_rgba(0,0,0,0.3)]">${item.ico}</div>`, opts: r.opts, ok: r.ok, en: item.en, pregunta: `¿Cómo se dice ${item.es} en inglés?`, respuesta: `se dice ${item.en}` }; 
};

GEN.g11= () => { 
  const item = rp(D.colors); const arrErr = mezclar(D.colors.filter(x => x.en !== item.en)).slice(0, 3); const r = O(item.en, arrErr.map(x=>x.en));
  return { p: `El color <span class="text-pink-400">"${item.es}"</span> en Inglés es...<br><div class="w-48 h-48 rounded-full mx-auto my-12 border-[12px] border-white shadow-[0_20px_0_rgba(0,0,0,0.3)]" style="background:${item.c}"></div>`, opts: r.opts, ok: r.ok, en: item.en, pregunta: `¿Cómo se dice el color ${item.es} en inglés?`, respuesta: `se dice ${item.en}` }; 
};

// Asignar Juegos
GEN.g20 = () => ({ especial: 'memoria' });
GEN.g21 = () => ({ especial: 'rompe' });
GEN.g22 = () => ({ especial: 'arcade' });
GEN.g23 = () => ({ especial: 'pizarra' });

// Autocompletar los 60 juegos
for(let i=3; i<=60; i++) {
  if(!GEN[`g${i}`]) { GEN[`g${i}`] = () => rp([GEN.g1, GEN.g2, GEN.g10, GEN.g11])(); }
}

const CATS = ["🔢 Matemáticas", "🧠 Memoria", "🎨 Arte y Arcade", "🔤 Inglés Mágico", "🚀 Desafíos", "🌟 Explorador"];
const JUEGOS = [
  {c:0, n:"➕ Sumas Mágicas", g:"g1"}, {c:0, n:"➖ Restas Divertidas", g:"g2"}, 
  ...Array.from({length:8}, (_,i)=>({c:0, n:`Misión Math ${i+1}`, g:`g${3+i}`})),
  {c:1, n:"🃏 Memoria 3D", g:"g20"}, {c:1, n:"🧩 Rompecabezas", g:"g21"}, 
  ...Array.from({length:8}, (_,i)=>({c:1, n:`Lógica Nivel ${i+1}`, g:`g${24+i}`})),
  {c:2, n:"⭐ Atrapa Estrellas", g:"g22"}, {c:2, n:"🎨 Pizarra Libre", g:"g23"},
  ...Array.from({length:8}, (_,i)=>({c:2, n:`Arte Misión ${i+1}`, g:`g${32+i}`})),
  {c:3, n:"🐶 Animales Inglés", g:"g10"}, {c:3, n:"🎨 Colores Inglés", g:"g11"},
  ...Array.from({length:8}, (_,i)=>({c:3, n:`English Nivel ${i+1}`, g:`g${40+i}`})),
  ...Array.from({length:10}, (_,i)=>({c:4, n:`Cohete ${i+1}`, g:`g${48+i}`})),
  ...Array.from({length:10}, (_,i)=>({c:5, n:`Galaxia ${i+1}`, g:`g${51+i}`}))
];

function dibCats() {
  document.getElementById('cats').innerHTML = CATS.map((n, i) => `<button class="btn-3d ${i === CA ? 'btn-yellow' : 'btn-cyan'}" data-c="${i}">${n}</button>`).join('');
  document.querySelectorAll('#cats button').forEach(b => b.onclick = () => { sonido.click(); CA = +b.dataset.c; dibTabs(); });
}
function dibTabs() {
  const js = JUEGOS.filter(j => j.c === CA); if(js.length > 0) J = JUEGOS.indexOf(js[0]);
  document.getElementById('tabs').innerHTML = js.map(x => `<button class="tab-btn ${JUEGOS.indexOf(x) === J ? 'active' : ''}" data-j="${JUEGOS.indexOf(x)}">${x.n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { sonido.click(); J = +b.dataset.j; document.querySelectorAll('#tabs button').forEach(tb => tb.classList.remove('active')); b.classList.add('active'); cargarJ(); }); 
  cargarJ();
}
function cargarJ() {
  runId++; const j = JUEGOS[J];
  document.getElementById('juegos').innerHTML = `<h2 class="tit-cartoon text-center mb-16">${j.n}</h2><div id="gameContainer"></div>`;
  const d = GEN[j.g]();
  if (d && d.especial) {
    if (d.especial === 'memoria') jMemoria(); else if (d.especial === 'rompe') jRompe(); else if (d.especial === 'arcade') jArcade(); else if (d.especial === 'pizarra') jPizarra();
  } else {
    quiz({ p: d.p, opts: d.opts, ok: d.ok, en: d.en, ico: d.ico, pregunta: d.pregunta, respuesta: d.respuesta, next: cargarJ });
  }
}

window.onload = () => {
  cargarPerfil(); dibCats(); dibTabs();
  setTimeout(() => { document.getElementById('intro').style.opacity = 0; setTimeout(() => document.getElementById('intro').remove(), 1000); hablarWoody("¡Hola! Soy Woody. ¡Vamos a aprender y jugar juntos!"); }, 2500);
  setTimeout(() => document.getElementById('barraCarga').style.width = '100%', 200);
};
