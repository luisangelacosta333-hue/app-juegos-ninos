<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚀 Woody Planet · Experiencia Educativa Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* CSS SUPER PREMIUM - DEEP SPACE & MAGIC */
:root {
  --bg-dark: #03000a;
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.6);
  --neon-cyan: #00f0ff;
  --neon-pink: #ff007f;
  --neon-purple: #8a2be2;
}

* { font-family: 'Nunito', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; padding: 0; min-height: 100vh; color: #fff; overflow-x: hidden; scroll-behavior: smooth; cursor: default; }
body { background: var(--bg-dark); }

/* Fondo Mágico Espacial */
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; }
body::before {
  background: radial-gradient(circle at 15% 30%, rgba(138, 43, 226, 0.25), transparent 50%),
              radial-gradient(circle at 85% 70%, rgba(0, 240, 255, 0.25), transparent 50%),
              radial-gradient(circle at 50% 100%, rgba(255, 0, 127, 0.2), transparent 50%);
  animation: cosmicPulse 15s ease-in-out infinite alternate;
}
body::after {
  background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
  background-size: 50px 50px; opacity: 0.15; transform: perspective(600px) rotateX(15deg) translateY(-20px);
}
@keyframes cosmicPulse { 0% { transform: scale(1); } 100% { transform: scale(1.08) rotate(1deg); } }

/* Chispas Mágicas */
.click-spark { position: fixed; width: 12px; height: 12px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 99999; box-shadow: 0 0 15px #fff, 0 0 30px var(--neon-cyan); animation: sparkAnim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
@keyframes sparkAnim { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

/* Cajas Premium */
.vidrio {
  position: relative; background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border-radius: 50px; padding: 50px 30px; border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 2px 0 rgba(255,255,255,0.15);
}
.vidrio-fino {
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  backdrop-filter: blur(15px); border: 2px solid rgba(255,255,255,0.2); border-radius: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.2); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.vidrio-fino:hover { transform: translateY(-8px) scale(1.03); background: rgba(255,255,255,0.18); box-shadow: 0 20px 50px rgba(0,240,255,0.3); border-color: rgba(0,240,255,0.5); }

/* Neón Animado */
.tit-neon {
  font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(90deg, #00f0ff, #8a2be2, #ff007f, #fde047, #00f0ff);
  background-size: 300% 100%; -webkit-background-clip: text; color: transparent;
  animation: bgGlow 6s linear infinite; filter: drop-shadow(0 0 25px rgba(138,43,226,0.7));
}
@keyframes bgGlow { to { background-position: 300% } }

/* Botones Grandes */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 65px; padding: 15px 35px; border-radius: 100px;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
  border: 2px solid rgba(255,255,255,0.25); color: #fff; font-weight: 900; font-size: 1.3rem;
  cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.2);
}
.btn:hover { background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1)); transform: translateY(-6px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.5); }
.btn:active { transform: scale(0.92) !important; }

.btn.on { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border-color: #fff; box-shadow: 0 10px 40px rgba(138, 43, 226, 0.9), inset 0 2px 5px rgba(255,255,255,0.5); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.tab-btn { padding: 15px 30px; border-radius: 20px; font-size: 1.2rem; font-weight: 800; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.15); color: #cbd5e1; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab-btn:hover { background: rgba(255,255,255,0.2); color: #fff; transform: translateY(-4px); box-shadow: 0 8px 20px rgba(255,255,255,0.15); }
.tab-btn.active { background: linear-gradient(135deg, #facc15, #f59e0b); color: #451a03; border-color: #fff; box-shadow: 0 10px 30px rgba(250, 204, 21, 0.7); }

/* Opciones de Juego - Enormes para Niños */
.pal {
  padding: 35px 25px; border-radius: 40px; font-size: 2.2rem; font-weight: 900;
  cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  border: 3px solid rgba(255,255,255,0.2); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; min-height: 180px; text-align: center; line-height: 1.3;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.15);
}
.pal .ico { font-size: 6rem; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.pal:hover { transform: translateY(-12px) scale(1.05); background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); border-color: rgba(0,240,255,0.6); box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 30px rgba(0,240,255,0.3); }
.pal:hover .ico { transform: scale(1.15) translateY(-5px); }
.pal:active { transform: scale(0.95); }

/* Feedback Educativo */
.ok { background: linear-gradient(135deg, #10b981, #059669) !important; border-color: #fff !important; color: #fff !important; box-shadow: 0 0 60px rgba(16, 185, 129, 1) !important; animation: correctBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important; }
.no { background: linear-gradient(135deg, #ef4444, #b91c1c) !important; border-color: #fecaca !important; color: #fff !important; box-shadow: 0 0 50px rgba(239, 68, 68, 0.9) !important; animation: errorShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important; }
@keyframes correctBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-15px); } }
@keyframes errorShake { 10%, 90% { transform: translate3d(-3px, 0, 0); } 20%, 80% { transform: translate3d(6px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-12px, 0, 0); } 40%, 60% { transform: translate3d(12px, 0, 0); } }

/* Elementos Especiales */
.btn-oro { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; border: 3px solid #fef08a; box-shadow: 0 12px 35px rgba(217,119,6,0.8); text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
.bocina { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: 4px solid #fff; border-radius: 50%; width: 100px; height: 100px; font-size: 4rem; cursor: pointer; box-shadow: 0 15px 40px rgba(0,240,255,0.7); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; justify-content: center; margin: 0 auto; z-index: 10; }
.bocina:hover { transform: scale(1.15) rotate(-15deg); box-shadow: 0 25px 60px rgba(0,240,255,1); }
.bocina:active { transform: scale(0.9); }

/* Profe Astronauta */
.prof-container { position: fixed; bottom: 30px; right: 30px; z-index: 55; cursor: pointer; transition: transform 0.3s; }
.prof { font-size: 7rem; filter: drop-shadow(0 20px 30px rgba(0,240,255,0.8)); animation: floatAstronaut 5s ease-in-out infinite; transform-origin: center; }
.prof-container:hover .prof { animation: hyperSpace 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
@keyframes floatAstronaut { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-25px) rotate(-10deg); } 75% { transform: translateY(-20px) rotate(10deg); } }
@keyframes hyperSpace { 0% { transform: scale(1); } 50% { transform: scale(1.5) translateY(-50px) rotate(-25deg); filter: drop-shadow(0 40px 60px rgba(255,0,127,1)); } 100% { transform: scale(1.3) translateY(-30px) rotate(-15deg); filter: drop-shadow(0 30px 40px rgba(255,0,127,0.9)); } }

/* Globo de Texto GIGANTE */
.globo { position: fixed; bottom: 180px; right: 140px; z-index: 54; max-width: 400px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); color: #0f172a; padding: 30px 35px; border-radius: 40px 40px 8px 40px; font-weight: 900; font-size: 1.6rem; line-height: 1.4; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border: 4px solid var(--neon-cyan); animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
.globo::after { content: ""; position: absolute; bottom: -20px; right: 40px; border: 20px solid transparent; border-top-color: var(--neon-cyan); }
.globo::before { content: ""; position: absolute; bottom: -14px; right: 44px; border: 14px solid transparent; border-top-color: #fff; z-index: 1; }
@keyframes popIn { from { opacity: 0; transform: translateY(40px) scale(0.6) rotate(8deg); } }

/* Modales */
.modal-overlay { position: fixed; inset: 0; background: rgba(3,0,10,0.92); backdrop-filter: blur(20px); z-index: 99000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px; }
.modal-overlay.activo { opacity: 1; pointer-events: auto; }
.particula { position: fixed; width: 18px; height: 18px; border-radius: 50%; pointer-events: none; z-index: 99998; animation: confeti 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; box-shadow: 0 0 20px currentColor; }
@keyframes confeti { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(1080deg); opacity: 0; } }

/* =========================================
   ESTILOS PREMIUM PARA JUEGOS INTERACTIVOS 
   ========================================= */

/* MEMORIA 3D GIGANTE */
.carta { aspect-ratio: 1/1; cursor: pointer; perspective: 1200px; user-select: none; }
.carta-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
.carta.girada .carta-inner { transform: rotateY(180deg) scale(1.05); }
.cara { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 5.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
.cf { background: linear-gradient(135deg, #1e293b, #0f172a); color: #38bdf8; border: 3px solid rgba(56,189,248,0.4); font-family: 'Orbitron'; font-weight: 900; }
.cf::after { content: "★"; font-size: 3rem; opacity: 0.6; position: absolute; }
.ca { transform: rotateY(180deg); background: linear-gradient(135deg, #fef08a, #f59e0b); border: 3px solid #fff; }

/* ROMPECABEZAS */
.rompe-ficha { aspect-ratio: 1/1; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 4.5rem; font-weight: 900; cursor: pointer; transition: all 0.2s; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.rompe-llena { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: 3px solid rgba(255,255,255,0.6); text-shadow: 0 3px 6px rgba(0,0,0,0.6); }
.rompe-llena:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 15px 40px rgba(0,240,255,0.7); }
.rompe-vacia { background: rgba(0,0,0,0.5); border: 3px dashed rgba(255,255,255,0.3); }

/* SIMON DICE NEON */
.simon-btn { border-radius: 40px; cursor: pointer; opacity: 0.35; transition: all 0.15s; border: 8px solid rgba(255,255,255,0.15); box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }
.simon-btn.activo { opacity: 1; transform: scale(1.1); box-shadow: 0 0 70px currentColor, inset 0 0 40px #fff; border-color: #fff; z-index: 10; }

/* TECLADO PIANO */
.tecla { flex: 1; margin: 0 4px; border-radius: 0 0 25px 25px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 25px; font-weight: 900; transition: all 0.1s; user-select: none; font-size: 1.5rem; }
.tecla-blanca { background: linear-gradient(180deg, #ffffff, #e2e8f0); height: 280px; z-index: 1; border: 2px solid #cbd5e1; color: #0f172a; box-shadow: 0 12px 25px rgba(0,0,0,0.5), inset 0 -6px 15px rgba(0,0,0,0.15); }
.tecla-blanca.activa { background: #cbd5e1; transform: translateY(8px); box-shadow: 0 3px 8px rgba(0,0,0,0.5); color: var(--neon-pink); }
.tecla-negra { background: linear-gradient(180deg, #1e293b, #020617); height: 160px; width: 60px; margin-left: -30px; margin-right: -30px; z-index: 2; color: #38bdf8; box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 -4px 10px rgba(255,255,255,0.3); border-radius: 0 0 15px 15px; }
.tecla-negra.activa { background: #334155; transform: translateY(8px); color: var(--neon-cyan); }

@media (max-width: 640px) {
  .prof-container { right: 10px; bottom: 10px; } .prof { font-size: 5rem; }
  .globo { right: 100px; bottom: 140px; font-size: 1.2rem; max-width: 260px; padding: 20px; }
  .pal { min-height: 140px; padding: 20px; font-size: 1.6rem; } .pal .ico { font-size: 4.5rem; }
  .btn { min-height: 55px; padding: 12px 25px; font-size: 1.1rem; }
}
</style>
</head>
<body>

<div id="intro" class="fixed inset-0 bg-[#03000a] z-[100000] flex items-center justify-center flex-col transition-opacity duration-700">
  <div class="text-[120px] mb-8 drop-shadow-[0_0_50px_rgba(0,240,255,1)] animate-bounce">🚀</div>
  <div class="tit-neon text-5xl md:text-8xl text-center">WOODY PLANET</div>
  <div class="text-cyan-300 mt-6 font-black text-3xl tracking-[0.3em] uppercase drop-shadow-lg">Ultimate Educativo</div>
  <div class="w-[400px] h-6 bg-white/15 rounded-full mt-14 overflow-hidden border-2 border-white/30 p-1"><div class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 w-0 transition-all duration-1000 shadow-[0_0_20px_rgba(255,0,127,1)]" id="barraCarga"></div></div>
</div>

<div class="max-w-[1400px] mx-auto px-6 py-8 flex justify-between items-center gap-5 flex-wrap relative z-10">
  <div class="vidrio-fino p-4 px-8 flex items-center gap-6 cursor-pointer" onclick="mostrarPerfil()">
    <div id="avatarPerfil" class="text-6xl bg-white/10 rounded-full w-20 h-20 flex items-center justify-center border-2 border-white/30 shadow-[0_0_25px_rgba(255,255,255,0.4)]">👦</div>
    <div>
      <div id="nomP" class="font-black text-white text-2xl tracking-wider">Jugador</div>
      <div class="text-xl font-bold text-yellow-400 drop-shadow-md">🪙 <span id="monedasTot">0</span></div>
    </div>
  </div>
  <div class="flex gap-5 flex-wrap">
    <button class="btn border-pink-500 hover:border-pink-400 shadow-[0_0_25px_rgba(255,0,127,0.5)]" onclick="verAnuncio()">🎬 +50 Monedas</button>
    <button class="btn" onclick="abrirTienda()">🏪 Tienda</button>
    <button class="btn" onclick="sonido.toggleMusica()" id="btnMus">🔇 Música</button>
  </div>
</div>

<div class="max-w-[1200px] mx-auto px-6 pt-8 pb-48 relative z-10">
  <div class="flex flex-wrap gap-5 justify-center mb-10 bg-black/40 p-6 rounded-[50px] border-2 border-white/15 backdrop-blur-xl shadow-2xl" id="cats"></div>
  <div class="flex flex-wrap gap-4 justify-center mb-14" id="tabs"></div>
  <div id="juegos" class="vidrio min-h-[600px]"></div>
</div>

  <div class="prof" id="prof">👨‍🚀</div>
</div>

<div id="mascotaFija" class="fixed bottom-10 left-10 z-50 text-[100px] hidden drop-shadow-[0_0_40px_rgba(255,255,255,0.8)] animate-bounce"></div>

<!-- MODALES PREMIUM GIGANTES -->
<div id="perfilModal" class="modal-overlay"><div class="vidrio max-w-xl w-full p-14 text-center"><h2 class="tit-neon text-6xl mb-12">Tu Perfil</h2><input id="nomPerfil" placeholder="Tu nombre" class="w-full p-6 rounded-3xl bg-black/50 border-4 border-white/20 text-white text-center text-4xl mb-12 outline-none focus:border-cyan-400 focus:shadow-[0_0_35px_rgba(0,240,255,0.6)] transition-all font-black"><div id="avatares" class="grid grid-cols-3 gap-6 mb-12"></div><button class="btn btn-oro w-full text-4xl py-6" onclick="guardarPerfil()">✅ Guardar</button></div></div>

<script>
// ==========================================
// SISTEMA CORE, AUDIO Y EFECTOS
// ==========================================
let runId = 0; 
const sonido = (() => { let ctx; const ini = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }; const tono = (f = 440, d = 0.2, t = 'sine', v = 0.1) => { ini(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d); }; const mel = arr => arr.forEach(([f, d], n) => setTimeout(() => tono(f, d), n * 140)); return { ini, tono, click: () => tono(600, 0.05, 'square', 0.05), ok: () => mel([[523, 0.1], [659, 0.1], [784, 0.15]]), no: () => mel([[300, 0.15], [200, 0.2]]), ganar: () => mel([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.3]]), moneda: () => tono(1200, 0.1, 'sine', 0.05), toggleMusica() { ini(); this._m = !this._m; document.getElementById('btnMus').textContent = this._m ? '🔊 Música' : '🔇 Música'; if (this._m) { const n = [261, 329, 392, 523]; let i = 0; const lp = () => { if (!this._m) return; tono(n[i % 4], 0.2, 'triangle', 0.02); i++; this._t = setTimeout(lp, 600); }; lp(); } else clearTimeout(this._t); } }; })(); 

// Efecto de chispas en toda la pantalla
document.addEventListener('click', (e) => {
  sonido.ini();
  const spark = document.createElement('div'); spark.className = 'click-spark';
  spark.style.left = e.clientX + 'px'; spark.style.top = e.clientY + 'px';
  spark.style.setProperty('--tx', (Math.random() - 0.5) * 120 + 'px');
  spark.style.setProperty('--ty', (Math.random() - 0.5) * 120 + 'px');
  document.body.appendChild(spark); setTimeout(() => spark.remove(), 800);
});

// MOTOR DE VOZ
function hablarIngles(texto) { try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1; const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }

function hablarWoody(texto, esIngles = false) { 
  const g = document.getElementById('globo'); g.textContent = texto; g.classList.remove('hidden'); 
  clearTimeout(g._t); g._t = setTimeout(() => g.classList.add('hidden'), 5000); 
  try { 
    if ('speechSynthesis' in window) { 
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); 
      if(esIngles) {

    respuesta: `se dice ${item.en} en inglés`
  }; 
};
GEN.g19= () => { 
  const item = rp(D.colors);
  const arrErr = mezclar(D.colors.filter(x => x.en !== item.en)).slice(0, 3);
  const r = O(item.en, arrErr.map(x=>x.en));
  return { 
    p: `El color <span class="text-pink-400">"${item.es}"</span> en Inglés es...<br><div class="w-40 h-40 rounded-full mx-auto my-8 border-8 border-white shadow-[0_0_40px_${item.c}]" style="background:${item.c}"></div>`, 
    opts: r.opts, ok: r.ok, en: item.en,
    pregunta: `¿Cómo se dice el color ${item.es} en inglés?`,
    respuesta: `se dice ${item.en}`
  }; 
};

GEN.g11 = () => ({ especial: 'memoria' });

}

const JUEGOS = [
  {c:0, n:"➕ Sumas Mágicas", g:"g1"}, {c:0, n:"➖ Restas", g:"g2"}, {c:0, n:"➕ Sumas 2", g:"g3"}, {c:0, n:"➖ Restas 2", g:"g4"},
  ...Array.from({length:6}, (_,i)=>({c:0, n:`Misión Math ${i+1}`, g:`g${5+i}`})),
  
  {c:1, n:"🃏 Memoria 3D", g:"g11"}, {c:1, n:"🧩 Rompecabezas", g:"g12"}, {c:1, n:"🎮 Simón Dice", g:"g13"},
  ...Array.from({length:7}, (_,i)=>({c:1, n:`Lógica Nivel ${i+1}`, g:`g${24+i}`})),

  {c:2, n:"⭐ Atrapa Estrellas", g:"g14"}, {c:2, n:"🎨 Pizarra Mágica", g:"g15"}, {c:2, n:"🎹 Piano Galáctico", g:"g16"},
  ...Array.from({length:7}, (_,i)=>({c:2, n:`Arte Misión ${i+1}`, g:`g${29+i}`})),

  {c:3, n:"🐶 Animales en Inglés", g:"g10"}, {c:3, n:"🎨 Colores en Inglés", g:"g19"},
  ...Array.from({length:8}, (_,i)=>({c:3, n:`English Nivel ${i+1}`, g:`g${35+i}`})),

  ...Array.from({length:10}, (_,i)=>({c:4, n:`Cohete ${i+1}`, g:`g${43+i}`})),
  ...Array.from({length:10}, (_,i)=>({c:5, n:`Galaxia ${i+1}`, g:`g${51+i}`}))
];

function dibCats() {
  document.getElementById('cats').innerHTML = CATS.map((n, i) => `<button class="btn ${i === CA ? 'on' : 'border-white/25'}" data-c="${i}">${n}</button>`).join('');
  document.querySelectorAll('#cats button').forEach(b => b.onclick = () => { sonido.click(); CA = +b.dataset.c; dibTabs(); });
}
function dibTabs() {
  const js = JUEGOS.filter(j => j.c === CA); if(js.length > 0) J = JUEGOS.indexOf(js[0]);
  document.getElementById('tabs').innerHTML = js.map(x => `<button class="tab-btn ${JUEGOS.indexOf(x) === J ? 'active' : ''}" data-j="${JUEGOS.indexOf(x)}">${x.n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { 
    sonido.click(); J = +b.dataset.j; 
    document.querySelectorAll('#tabs button').forEach(tb => tb.classList.remove('active')); 
    b.classList.add('active'); cargarJ(); 
  }); 
  cargarJ();
}
function cargarJ() {
  runId++; 
  const j = JUEGOS[J];
  document.getElementById('juegos').innerHTML = `<h2 class="text-5xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 mb-14 text-center tracking-tight drop-shadow-lg uppercase">${j.n}</h2><div id="gameContainer" class="animate-[popIn_0.5s_cubic-bezier(0.34,1.56,0.64,1)]"></div>`;
  const d = GEN[j.g]();
  
  if (d && d.especial) {
    if (d.especial === 'memoria') jMemoria();
    else if (d.especial === 'rompe') jRompe();
    else if (d.especial === 'simon') jSimon();
    else if (d.especial === 'arcade') jArcade();
    else if (d.especial === 'pizarra') jPizarra();
    else if (d.especial === 'piano') jPiano();
  } else {
    // LLAMA A LA FUNCION PRINCIPAL CON LA CORRECCIÓN VERBAL
    quiz({ p: d.p, opts: d.opts, ok: d.ok, en: d.en, ico: d.ico, pregunta: d.pregunta, respuesta: d.respuesta, next: cargarJ });
  }
}

window.onload = () => {
  cargarPerfil(); dibCats(); dibTabs();
  setTimeout(() => { document.getElementById('intro').style.opacity = 0; setTimeout(() => document.getElementById('intro').remove(), 1000); hablarWoody("¡Hola! Soy Woody. ¡Vamos a aprender y divertirnos juntos!"); }, 2500);
  setTimeout(() => document.getElementById('barraCarga').style.width = '100%', 200);
};
